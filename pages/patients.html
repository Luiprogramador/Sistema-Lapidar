<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacientes — Lapidar</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/parity-overrides.css">
<link rel="icon" type="image/png" href="../assets/favicon.png">
</head>
<body class="patients-page">
<div id="topbar-container"></div>
<div id="sidebar-container"></div>

<main class="main-content page-enter">
  <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;">
    <div>
      <h1 class="page-title">Pacientes</h1>
      <p class="page-subtitle">Gerencie e acompanhe todas as pacientes</p>
    </div>
    <button class="btn btn-primary" id="btn-nova-paciente">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nova paciente
    </button>
  </div>

  <section class="patient-filter-panel" aria-label="Buscar e filtrar pacientes">
    <div class="patient-filter-search">
      <div class="search-bar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" class="search-input" id="search-input" placeholder="Buscar paciente pelo nome...">
      </div>
      <button class="btn btn-subtle patient-filter-toggle" id="patient-filter-toggle" type="button" aria-expanded="false" aria-controls="patient-filter-options">
        <span aria-hidden="true">☷</span> Filtros
      </button>
    </div>
    <div id="patient-filter-options" class="patient-filter-options" hidden>
      <div class="filter-chips" id="proto-filters">
        <button class="filter-chip active" data-proto="Todos">Todos</button>
        <button class="filter-chip" data-proto="Lapidar 40+">Lapidar 40+</button>
        <button class="filter-chip" data-proto="Lapidar SOP">Lapidar SOP</button>
        <button class="filter-chip" data-proto="Lapidar Fertilidade">Lapidar Fertilidade</button>
        <button class="filter-chip" data-proto="Pocket">Pocket</button>
      </div>
      <label for="patient-status-filter" class="patient-status-filter">
        Status
        <select id="patient-status-filter" class="form-input">
          <option value="Todas">Todas</option>
          <option value="Ativa">Ativas</option>
          <option value="Inativa">Inativas</option>
        </select>
      </label>
    </div>
  </section>

  <header class="patient-list-heading">
    <span class="patient-list-icon" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </span>
    <div>
      <h2>Lista de pacientes</h2>
      <p id="patients-count" aria-live="polite"></p>
    </div>
  </header>

  <!-- Grid de cards -->
  <div class="grid-responsive-3" id="patients-grid" style="gap:18px;"></div>
  <div id="patients-pagination" class="patients-pagination" aria-label="Paginação de pacientes"></div>
  <div id="empty-state" class="hidden">
    <div class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <p>Nenhuma paciente encontrada com esses filtros.</p>
    </div>
  </div>
</main>


<!-- Modal nova paciente -->
<div class="modal-overlay" id="modal-paciente">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Nova Paciente</span>
      <button class="modal-close" id="close-modal">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Nome completo *</label>
          <input type="text" class="form-input" id="new-p-nome" placeholder="Nome da paciente">
        </div>
        <div class="form-group">
          <label class="form-label">Telefone *</label>
          <input type="tel" class="form-input" id="new-p-tel" placeholder="(00) 00000-0000">
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label" for="new-p-email">E-mail *</label>
          <input type="email" class="form-input" id="new-p-email" placeholder="nome@exemplo.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label">CPF</label>
          <input type="text" class="form-input" id="new-p-cpf" placeholder="000.000.000-00">
        </div>
        <div class="form-group">
          <label class="form-label">Data de nascimento *</label>
          <input type="date" class="form-input" id="new-p-nasc">
        </div>
        <div class="form-group">
          <label class="form-label">Consulta atual</label>
          <input type="text" class="form-input" id="new-p-consulta" value="1ª Consulta">
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Objetivo</label>
          <input type="text" class="form-input" id="new-p-obj" placeholder="Ex: perda de peso, equilíbrio hormonal...">
        </div>
        <div class="form-group">
          <label class="form-label">Protocolo *</label>
          <select class="form-select" id="new-p-proto">
            <option value="">Selecionar...</option>
            <option>Lapidar 40+</option>
            <option>Lapidar SOP</option>
            <option>Lapidar Fertilidade</option>
            <option>Pocket</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Peso inicial (kg) *</label>
          <input type="number" class="form-input" id="new-p-peso" placeholder="Ex: 75.5" step="0.1">
        </div>
        <div class="form-group">
          <label class="form-label">Meta de peso (kg)</label>
          <input type="number" class="form-input" id="new-p-meta" placeholder="Opcional" min="1" step="0.1">
        </div>
        <div class="form-group">
          <label class="form-label">TRH</label>
          <select class="form-select" id="new-p-trh">
            <option>Não</option>
            <option>Sim</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Contraceptivo</label>
          <input type="text" class="form-input" id="new-p-contra" placeholder="Ex: DIU, pílula...">
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Origem do lead</label>
          <select class="form-select" id="new-p-lead">
            <option value="">Selecionar...</option>
            <option>Indicação</option>
            <option>Instagram</option>
            <option>Google</option>
            <option>TikTok</option>
            <option>Podcast</option>
            <option>Indicação médica</option>
          </select>
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Observações</label>
          <textarea class="form-textarea" id="new-p-obs" placeholder="Observações relevantes..."></textarea>
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label" for="new-p-allergies">Alergias</label>
          <input type="text" class="form-input" id="new-p-allergies" placeholder="Separe por vírgulas; deixe em branco se não informado">
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label" for="new-p-goals">Metas personalizadas (opcional)</label>
          <textarea class="form-textarea" id="new-p-goals" rows="3" placeholder="Uma por linha: nome | frequência desejada&#10;Ex.: Caminhada | 3x/semana&#10;Sono regular | diariamente"></textarea>
          <small class="text-muted">Não é necessário cadastrar meta de peso ou qualquer meta que não tenha sido combinada com a paciente.</small>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-subtle" id="cancel-modal">Cancelar</button>
      <button class="btn btn-primary" id="save-paciente">Cadastrar Paciente</button>
    </div>
  </div>
</div>

<script src="../js/demo-data.js"></script>
<script src="../js/data.js"></script>
<script src="../js/router.js"></script>
<script src="../js/components.js"></script>
<script>
  if (Router.getRole() === 'patient') {
    Router.navigate('patient-detail');
  } else {
  initShell('patients');
  const contactOnlyRegistration = Router.getRole() === 'secretary';
  const activePatientCount = PACIENTES.filter(patient => patient.ativo !== false && patient.status !== 'Inativa').length;
  document.querySelector('.page-header .page-subtitle').textContent =
    `${PACIENTES.length} de ${PACIENTES.length} pacientes · ${activePatientCount} ativas`;
  if (contactOnlyRegistration) {
    document.querySelector('.page-header .page-subtitle').textContent =
      `${PACIENTES.length} de ${PACIENTES.length} pacientes · ${activePatientCount} ativas · Contatos e jornada operacional`;
    document.getElementById('save-paciente').textContent = 'Salvar dados de contato';
    ['new-p-consulta','new-p-obj','new-p-proto','new-p-peso','new-p-meta','new-p-trh','new-p-contra','new-p-lead','new-p-obs','new-p-allergies','new-p-goals']
      .forEach(id => { document.getElementById(id).closest('.form-group').hidden = true; });
  }

  let searchTerm = '';
  let currentPage = 1;
  const patientsPerPage = 6;
  let activeProto = Router.getState().filterProtocol || 'Todos';
  let activeStatus = Router.getState().filterStatus || 'Todas';
  const statusFilter = document.getElementById('patient-status-filter');
  if (!['Todas', 'Ativa', 'Inativa'].includes(activeStatus)) activeStatus = 'Todas';
  statusFilter.value = activeStatus;
  if (!Array.from(document.querySelectorAll('#proto-filters .filter-chip')).some(button => button.dataset.proto === activeProto)) {
    activeProto = 'Todos';
  }
  document.querySelectorAll('#proto-filters .filter-chip').forEach(button => {
    button.classList.toggle('active', button.dataset.proto === activeProto);
  });

  function filterAndRender() {
    const filtered = PACIENTES.filter(p => {
      const matchName  = p.nome.toLowerCase().includes(searchTerm.toLowerCase());
      const matchProto = activeProto === 'Todos' || p.protocolo === activeProto;
      const inactive = p.ativo === false || p.status === 'Inativa';
      const matchStatus = activeStatus === 'Todas' || (activeStatus === 'Inativa' ? inactive : !inactive);
      return matchName && matchProto && matchStatus;
    }).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));

    const grid = document.getElementById('patients-grid');
    const empty = document.getElementById('empty-state');
    const pageCount = Math.max(1, Math.ceil(filtered.length / patientsPerPage));
    currentPage = Math.min(currentPage, pageCount);
    const pageStart = (currentPage - 1) * patientsPerPage;
    const visiblePatients = filtered.slice(pageStart, pageStart + patientsPerPage);
    document.getElementById('patients-count').textContent =
      `${filtered.length} resultado(s) encontrado(s)`;

    if (filtered.length === 0) {
      grid.innerHTML = '';
      empty.classList.remove('hidden');
    } else {
      empty.classList.add('hidden');
      grid.innerHTML = visiblePatients.map((p, i) => renderPatientCard(p, i)).join('');
      grid.querySelectorAll('[data-patient-profile]').forEach(button => {
        button.addEventListener('click', event => {
          event.stopPropagation();
          const patientId = Number(button.dataset.patientProfile);
          if (Router.getRole() === 'secretary') showPatientQuickModal(patientId);
          else Router.navigate('patient-profile', { patientId });
        });
      });
      grid.querySelectorAll('[data-patient-message]').forEach(button => {
        button.addEventListener('click', event => {
          event.stopPropagation();
          Router.navigate('messages', { patientId:Number(button.dataset.patientMessage) });
        });
      });
      grid.querySelectorAll('[data-patient-details]').forEach(button => {
        button.addEventListener('click', event => {
          event.stopPropagation();
          Router.navigate('patient-detail', { patientId:Number(button.dataset.patientDetails) });
        });
      });
    }
    const pagination = document.getElementById('patients-pagination');
    pagination.innerHTML = filtered.length > patientsPerPage ? `
      <span class="patients-pagination-summary">Mostrando ${pageStart + 1}–${Math.min(pageStart + patientsPerPage, filtered.length)} de ${filtered.length} pacientes</span>
      <div class="patients-pagination-controls">
        <button type="button" data-page="${currentPage - 1}" aria-label="Página anterior" ${currentPage === 1 ? 'disabled' : ''}>‹</button>
        ${Array.from({ length:pageCount }, (_, index) => index + 1).map(page =>
          `<button type="button" data-page="${page}" aria-current="${page === currentPage ? 'page' : 'false'}">${page}</button>`
        ).join('')}
        <button type="button" data-page="${currentPage + 1}" aria-label="Próxima página" ${currentPage === pageCount ? 'disabled' : ''}>›</button>
      </div>` : '';
    pagination.querySelectorAll('[data-page]').forEach(button => button.addEventListener('click', () => {
      const requestedPage = Number(button.dataset.page);
      if (Number.isInteger(requestedPage) && requestedPage >= 1 && requestedPage <= pageCount) {
        currentPage = requestedPage;
        filterAndRender();
      }
    }));
  }

  // Search
  document.getElementById('search-input').addEventListener('input', e => {
    searchTerm = e.target.value;
    currentPage = 1;
    filterAndRender();
  });
  document.getElementById('patient-filter-toggle').addEventListener('click', event => {
    const options = document.getElementById('patient-filter-options');
    const expanded = event.currentTarget.getAttribute('aria-expanded') === 'true';
    event.currentTarget.setAttribute('aria-expanded', String(!expanded));
    options.hidden = expanded;
  });

  // Proto filters
  document.querySelectorAll('#proto-filters .filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeProto = btn.dataset.proto;
      currentPage = 1;
      document.querySelectorAll('#proto-filters .filter-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterAndRender();
    });
  });
  statusFilter.addEventListener('change', () => {
    activeStatus = statusFilter.value;
    currentPage = 1;
    filterAndRender();
  });

  // Modal
  const modal = document.getElementById('modal-paciente');
  document.getElementById('btn-nova-paciente').addEventListener('click', () => modal.classList.add('open'));
  document.getElementById('close-modal').addEventListener('click', () => modal.classList.remove('open'));
  document.getElementById('cancel-modal').addEventListener('click', () => modal.classList.remove('open'));
  
  document.getElementById('save-paciente').addEventListener('click', () => {
    const nome = document.getElementById('new-p-nome').value.trim();
    const tel = document.getElementById('new-p-tel').value.trim();
    const email = document.getElementById('new-p-email').value.trim();
    const proto = document.getElementById('new-p-proto').value;
    const peso = parseFloat(document.getElementById('new-p-peso').value);
    const nasc = document.getElementById('new-p-nasc').value;
    const metaPesoInput = document.getElementById('new-p-meta').value.trim();
    const metaPeso = metaPesoInput ? Number(metaPesoInput) : null;
    const birth = nasc ? new Date(nasc + 'T00:00:00') : null;
    const today = new Date();

    if (!nome || !tel || !email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || !nasc ||
        !contactOnlyRegistration && (!proto || !Number.isFinite(peso) || peso <= 0) ||
        !birth || Number.isNaN(birth.getTime()) || birth > today ||
        !contactOnlyRegistration && metaPesoInput && (!Number.isFinite(metaPeso) || metaPeso <= 0)) {
      alert(contactOnlyRegistration
        ? 'Informe nome, telefone, e-mail válido e uma data de nascimento válida.'
        : 'Informe nome, telefone, e-mail válido, data de nascimento válida, protocolo e peso inicial válido. A meta de peso é opcional.');
      return;
    }

    const initials = nome.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    const now = new Date();
    let idade = now.getFullYear() - birth.getFullYear();
    if (now.getMonth() < birth.getMonth() || (now.getMonth() === birth.getMonth() && now.getDate() < birth.getDate())) idade--;
    const goals = document.getElementById('new-p-goals').value.split(/\r?\n/)
      .map(line => line.split('|').map(part => part.trim()))
      .filter(parts => parts[0])
      .map(([name, frequency], index) => ({
        id:'goal-' + Date.now() + '-' + index,
        nome:name,
        freqDesejada:frequency || 'Conforme combinado',
        meta:1,
        realizado:0,
        unidade:'vezes',
        desc:'',
      }));
    const allergies = document.getElementById('new-p-allergies').value
      .split(',').map(value => value.trim()).filter(Boolean);

    const newPatient = {
      id: PACIENTES.length + 1,
      nome: nome,
      iniciais: initials,
      idade: idade,
      nascimento: nasc ? formatDate(nasc) : '01/01/1985',
      cpf: document.getElementById('new-p-cpf').value.trim(),
      telefone: tel || '(11) 99999-9999',
      email: email,
      objetivo: contactOnlyRegistration ? 'A definir' : document.getElementById('new-p-obj').value.trim() || 'A definir',
      alergias: allergies,
      protocolo: contactOnlyRegistration ? 'A definir' : proto,
      consultaAtual: contactOnlyRegistration ? 'A definir' : document.getElementById('new-p-consulta').value.trim() || '1ª Consulta',
      pesoInicial: contactOnlyRegistration ? null : peso,
      pesoAtual: contactOnlyRegistration ? null : peso,
      meta: contactOnlyRegistration ? null : metaPeso,
      trh: contactOnlyRegistration ? 'Não informado' : document.getElementById('new-p-trh').value,
      contraceptivo: contactOnlyRegistration ? 'Não informado' : document.getElementById('new-p-contra').value || 'Não',
      circunferenciaAbdominal: '82 cm',
      pressao: '120/80 mmHg',
      metas: goals.map(goal => goal.nome),
      metasConcluidas: 0,
      origemLead: contactOnlyRegistration ? '' : document.getElementById('new-p-lead').value || 'Indicação',
      observacoes: contactOnlyRegistration ? '' : document.getElementById('new-p-obs').value || 'Paciente recém-cadastrada no sistema.',
      ultimaConsulta: contactOnlyRegistration ? '—' : new Date().toLocaleDateString('pt-BR'),
      proximaConsulta: contactOnlyRegistration ? 'A agendar' : dateOffset(14),
      bioimpedancia: contactOnlyRegistration ? [] : [
        { data: new Date().toLocaleDateString('pt-BR'), peso: peso, musculo: Math.round(peso*0.38*10)/10, gordura: Math.round(peso*0.42*10)/10, imc: parseFloat((peso/2.6).toFixed(1)), txGordura: 42.0, aguaCorporal: 44.0, gorduraVisceral: 10, tmb: 1500, nota: 6.0 }
      ],
      scoreLabels: ['Saciedade','Fome','Energia','Sono','Humor','Libido','Fogachos','Perda urinária','Constipação','Atividade física','Adesão'],
      scoreAtual:   contactOnlyRegistration ? Array(11).fill(null) : [6, 6, 6, 6, 7, 6, 8, 8, 7, 6, 7],
      scoreAnterior:contactOnlyRegistration ? Array(11).fill(null) : [6, 6, 6, 6, 7, 6, 8, 8, 7, 6, 7],
      riscoCV: { nivel:'', ldl:null, metaLdl:null, naoHdl:null, metaNaoHdl:null, reducaoLdl:null, dopplerCarotidas:null, lpa:null, metaLpa:null, pcrUs:null, metaPcrUs:null, has:'', dm:'', tabagismo:'', historiaFamiliar:'', fatores:[], sugestoes:[] },
      medicamentos: [],
      metasPersonalizadas: goals,
      arquivos: [],
      timeline: [
        { tipo: 'Consulta', data: new Date().toLocaleDateString('pt-BR'), icone: '🩺', titulo: 'Cadastro e Marco Zero', desc: 'Paciente cadastrada no Método Lapidar.' }
      ]
    };

    PACIENTES.unshift(newPatient);
    try {
      localStorage.setItem('lapidar-pacientes', JSON.stringify(PACIENTES));
    } catch (error) {
      PACIENTES.shift();
      console.error('Não foi possível salvar a paciente cadastrada.', error);
      alert('Não foi possível salvar o cadastro neste navegador. Verifique o espaço disponível.');
      return;
    }
    modal.classList.remove('open');
    filterAndRender();
    showPatientQuickModal(newPatient.id);
  });
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

  filterAndRender();
  }
</script>
<script src="../js/parity-enhancements.js"></script>
<script src="../js/round2-visual.js"></script>
</body>
</html>
