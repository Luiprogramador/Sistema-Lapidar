<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultas — Lapidar</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/parity-overrides.css">
  <style>
    .consultations-layout { display:grid; grid-template-columns:minmax(0,1fr); gap:20px; }
    .consultation-list { display:flex; flex-direction:column; gap:8px; }
    .consultation-row { display:flex; align-items:center; gap:12px; width:100%; padding:12px; text-align:left; border:1px solid var(--border); border-radius:var(--radius); background:var(--white); cursor:pointer; transition:var(--transition); }
    .consultation-row:hover, .consultation-row:focus-visible { border-color:var(--vinho); background:var(--vinho-xlight); }
    .consultation-date { min-width:76px; color:var(--vinho); font-size:12px; font-weight:600; }
    .consultation-details { flex:1; min-width:0; }
    .consultation-patient { color:var(--text-primary); font-size:13px; font-weight:600; }
    .consultation-meta { color:var(--text-muted); font-size:11px; margin-top:3px; }
    .consultation-period { display:grid; gap:8px; margin:0 0 14px; }
    .consultation-period-label { color:var(--text-secondary); font-size:13px; font-weight:700; }
    .consultation-period-options { display:flex; flex-wrap:wrap; gap:8px; }
    .consultation-period-options .filter-chip { min-height:42px; padding:9px 16px; }
    .consultation-filter-heading { display:flex; align-items:center; gap:14px; margin-bottom:18px; padding-bottom:18px; border-bottom:1px solid var(--border); }
    .consultation-filter-heading-icon { display:grid; flex:0 0 44px; width:44px; height:44px; place-items:center; border:1px solid var(--border); border-radius:12px; background:#f1e8e8; color:var(--vinho); }
    .consultation-filter-heading-icon svg { width:22px; height:22px; }
    .consultation-filter-heading h2 { flex:1; margin:0; color:var(--text-primary); font-family:var(--font-sans); font-size:20px; font-weight:750; }
    .consultation-filter-heading #open-calendar { display:none; }
    .consultation-search { position:relative; display:block; width:100%; margin-bottom:18px; }
    .consultation-search svg { position:absolute; top:50%; left:16px; width:20px; height:20px; color:var(--text-secondary); transform:translateY(-50%); pointer-events:none; }
    .consultation-search input { box-sizing:border-box; width:100%; min-height:60px; padding-left:52px; border-radius:13px; font-size:16px; }
    .consultation-filter-card { padding:24px; }
    .consultation-filter-label { display:block; margin:0 0 8px; color:var(--text-secondary); font-size:13px; font-weight:700; }
    .consultation-status-options { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .consultation-status-options .filter-chip { min-height:42px; padding:9px 16px; border:1px solid var(--border); border-radius:999px; background:var(--white); color:var(--text-primary); font-weight:600; }
    .consultation-status-options .filter-chip.active { border-color:var(--vinho); background:var(--vinho); color:var(--white); }
    .consultation-filter-actions { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .consultation-filter-actions .btn { min-height:48px; }
    .consultation-extra-filters { display:flex; align-items:end; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
    .consultation-extra-filters[hidden] { display:none; }
    .consultation-extra-filters .form-group { flex:1 1 150px; min-width:140px; margin:0; }
    .visually-hidden-control { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; clip-path:inset(50%); }
    @media (max-width: 600px) {
      .consultation-filter-card { padding:16px; }
      .consultation-filter-heading { gap:10px; margin-bottom:14px; padding-bottom:14px; }
      .consultation-search input { min-height:52px; }
    }
  </style>
</head><body class="consultations-page">
<div id="topbar-container"></div>
<div id="sidebar-container"></div>

<main class="main-content page-enter">
  <div class="page-header">
    <h1 class="page-title" id="consultations-title">Consultas</h1>
    <p class="page-subtitle" id="consultations-subtitle" hidden>Agenda e histórico de atendimentos por paciente</p>
  </div>

  <section class="consultations-overview" aria-labelledby="consultations-overview-title">
    <header class="dashboard-section-heading">
      <span class="section-heading-icon" aria-hidden="true">⌁</span>
      <div>
        <h2 id="consultations-overview-title">Visão rápida</h2>
      </div>
    </header>
  <div class="grid-responsive-4 consultations-stat-grid">
    <div class="card-stat"><span class="card-stat-label">Total de consultas</span><span class="card-stat-value" id="total-count">0</span><span class="card-stat-sub">No período selecionado</span></div>
    <div class="card-stat"><span class="card-stat-label">Próximas consultas</span><span class="card-stat-value" id="upcoming-count">0</span><span class="card-stat-sub">Agendadas</span></div>
    <div class="card-stat"><span class="card-stat-label">Exames pendentes</span><span class="card-stat-value" id="pending-exams-count">0</span><span class="card-stat-sub">Aguardando resultado</span></div>
    <div class="card-stat" id="clinical-alert-stat"><span class="card-stat-label">Alertas clínicos</span><span class="card-stat-value" id="clinical-alert-count">0</span><span class="card-stat-sub">Precisam de atenção</span></div>
  </div>
  </section>

  <div class="consultations-layout">
    <section class="card consultation-filter-card" aria-labelledby="consultations-list-title">
      <div class="consultation-filter-heading">
        <span class="consultation-filter-heading-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6.5 7.5V19l-3 1v-7.5L4 5Z"/></svg>
        </span>
        <h2 id="consultations-list-title">Busca e filtros</h2>
        <button class="btn btn-subtle btn-sm" id="open-calendar" type="button">Abrir calendário</button>
      </div>
      <label class="consultation-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
        <input type="search" id="consult-search" placeholder="Buscar pelo nome da paciente..." aria-label="Buscar consultas por paciente">
      </label>
      <div class="consultation-period">
        <span class="consultation-period-label">Período</span>
        <div class="consultation-period-options" role="group" aria-label="Período das consultas">
          <button class="filter-chip active" type="button" data-period="upcoming" aria-pressed="true">Próximas</button>
          <button class="filter-chip" type="button" data-period="history" aria-pressed="false">Anteriores (histórico)</button>
          <button class="filter-chip" type="button" data-period="all" aria-pressed="false">Todas</button>
        </div>
      </div>
      <span class="consultation-filter-label">Status</span>
      <div class="consultation-status-options" role="group" aria-label="Filtrar consultas por status">
        <button class="filter-chip active" type="button" data-status-chip="" aria-pressed="true">Todas</button>
        <button class="filter-chip" type="button" data-status-chip="agendada" aria-pressed="false">Agendada</button>
        <button class="filter-chip" type="button" data-status-chip="confirmada" aria-pressed="false">Confirmada</button>
        <button class="filter-chip" type="button" data-status-chip="concluida" aria-pressed="false">Concluída</button>
        <button class="filter-chip" type="button" data-status-chip="cancelada" aria-pressed="false">Cancelada</button>
        <button class="filter-chip" type="button" data-status-chip="nao_compareceu" aria-pressed="false">Não compareceu</button>
        <button class="filter-chip" type="button" data-status-chip="remarcada" aria-pressed="false">Reagendada</button>
      </div>
      <select class="form-select visually-hidden-control" id="consult-status" aria-label="Status">
        <option value="">Todas</option><option value="agendada">Agendada</option><option value="confirmada">Confirmada</option>
        <option value="concluida">Concluída</option><option value="cancelada">Cancelada</option><option value="nao_compareceu">Não compareceu</option><option value="remarcada">Reagendada</option>
      </select>
      <div class="consultation-filter-actions">
        <button class="btn btn-subtle" id="toggle-date-filters" type="button" aria-expanded="false" aria-controls="consult-date-filters">▦ &nbsp;Filtrar por data</button>
        <button class="btn btn-subtle" id="toggle-type-filters" type="button" aria-expanded="false" aria-controls="consult-type-filters">☷ &nbsp;Tipo ou protocolo</button>
      </div>
      <div class="consultation-extra-filters" id="consult-date-filters" hidden>
        <label class="form-group"><span class="form-label">De</span><input class="form-input" type="date" id="consult-date-from" aria-label="Filtrar consultas a partir da data"></label>
        <label class="form-group"><span class="form-label">Até</span><input class="form-input" type="date" id="consult-date-to" aria-label="Filtrar consultas até a data"></label>
        <button class="btn btn-subtle btn-sm" id="clear-consult-dates" type="button">Limpar datas</button>
      </div>
      <div class="consultation-extra-filters" id="consult-type-filters" hidden>
        <label class="form-group"><span class="form-label">Tipo de consulta</span><select class="form-select" id="consult-type"><option value="">Todos os tipos</option></select></label>
        <label class="form-group"><span class="form-label">Protocolo</span><select class="form-select" id="consult-protocol"><option value="">Todos os protocolos</option></select></label>
      </div>
      <p id="consultation-filter-feedback" role="status" style="font-size:12px;color:var(--red-text);margin-bottom:8px;"></p>
    </section>
    <section aria-labelledby="consultation-results-title">
      <header class="dashboard-section-heading" style="margin-bottom:14px;">
        <span class="section-heading-icon" aria-hidden="true">◷</span>
        <div><h2 id="consultation-results-title">Próximas consultas</h2><p id="consultation-results-count"></p></div>
      </header>
      <div class="card">
      <div class="consultation-list" id="consultation-list"></div>
      <nav class="financial-transactions-pagination" id="consultations-pagination" aria-label="Paginação de consultas"></nav>
      </div>
    </section>

  </div>
</main>

<script src="../js/demo-data.js"></script>
<script src="../js/data.js"></script>
<script src="../js/router.js"></script>
<script src="../js/components.js"></script>
<script>
  const role = Router.getRole();
  if (!Router.can('seeConsultations')) {
    Router.navigate(role === 'secretary' ? 'agenda' : Router.getHomePage());
  } else {
  initShell('consultations');

  const currentPatient = role === 'patient' ? Router.getSelectedPatient() : null;
  const patientConsultations = currentPatient
    ? CONSULTAS.filter(consultation => consultation.paciente === currentPatient.nome)
    : CONSULTAS;
  const sortedConsultations = patientConsultations.slice().sort((a, b) => (a.data + a.horario).localeCompare(b.data + b.horario));
  const today = new Date();
  const todayIso = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  if (role === 'patient') {
    document.getElementById('consultations-title').textContent = 'Minhas consultas';
    document.getElementById('consultations-subtitle').textContent = 'Acompanhe suas consultas, exames e orientações da equipe';
    document.getElementById('consultations-subtitle').hidden = false;
    document.getElementById('clinical-alert-stat').hidden = true;
    document.getElementById('consultations-list-title').textContent = 'Minhas consultas';
    document.getElementById('open-calendar').hidden = true;
  }
  document.getElementById('total-count').textContent = sortedConsultations.length;
  document.getElementById('upcoming-count').textContent =
    sortedConsultations.filter(consultation => consultation.data > todayIso && consultation.status === 'agendada').length;
  document.getElementById('pending-exams-count').textContent = sortedConsultations.reduce((total, consultation) =>
    total + (Array.isArray(consultation.examesPedidos)
      ? consultation.examesPedidos.filter(exam => exam.situacao === 'pendente').length
      : 0), 0);
  document.getElementById('clinical-alert-count').textContent = role === 'doctor' ? ALERTAS.length : 0;

  let consultationPage = 0;
  let consultationPeriod = 'upcoming';
  const consultationsPerPage = 6;
  const typeFilter = document.getElementById('consult-type');
  const protocolFilter = document.getElementById('consult-protocol');
  const populateFilterOptions = (select, values) => values.forEach(value => {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = value;
    select.appendChild(option);
  });
  populateFilterOptions(typeFilter, [...new Set(sortedConsultations.map(consultation => consultation.tipo))].sort((a, b) => a.localeCompare(b, 'pt-BR')));
  populateFilterOptions(protocolFilter, [...new Set(sortedConsultations.map(consultation => consultation.protocolo))].sort((a, b) => a.localeCompare(b, 'pt-BR')));
  function renderConsultations() {
    const from = document.getElementById('consult-date-from').value;
    const to = document.getElementById('consult-date-to').value;
    const search = document.getElementById('consult-search').value.trim().toLocaleLowerCase('pt-BR');
    const status = document.getElementById('consult-status').value;
    const type = typeFilter.value;
    const protocol = protocolFilter.value;
    const feedback = document.getElementById('consultation-filter-feedback');
    if (from && to && from > to) {
      feedback.textContent = 'A data inicial deve ser anterior ou igual à data final.';
      document.getElementById('consultation-list').replaceChildren();
      document.getElementById('consultations-pagination').replaceChildren();
      document.getElementById('consultations-pagination').hidden = true;
      document.getElementById('consultation-results-count').textContent = 'Corrija o período para ver as consultas.';
      return;
    }
    feedback.textContent = '';
    const filtered = sortedConsultations.filter(consultation =>
      (consultationPeriod === 'upcoming' ? consultation.data > todayIso
        : consultationPeriod === 'history' ? consultation.data <= todayIso : true) &&
      (!from || consultation.data >= from) && (!to || consultation.data <= to) &&
      (!search || consultation.paciente.toLocaleLowerCase('pt-BR').includes(search)) &&
      (!status || consultation.status === status) &&
      (!type || consultation.tipo === type) &&
      (!protocol || consultation.protocolo === protocol)
    );
    const hasFilters = Boolean(from || to || search || status || type || protocol);
    document.getElementById('total-count').textContent = hasFilters ? filtered.length : sortedConsultations.length;
    const periodLabels = { upcoming:'Próximas consultas', history:'Consultas anteriores', all:'Todas as consultas' };
    document.getElementById('consultation-results-title').textContent = periodLabels[consultationPeriod];
    document.getElementById('consultation-results-count').textContent = `${filtered.length} consulta(s) no filtro atual`;
    const statusLabels = {
      agendada: 'Agendada', confirmada: 'Confirmada', concluida: 'Concluída', remarcada: 'Reagendada',
      cancelada: 'Cancelada', nao_compareceu: 'Paciente não compareceu'
    };
    const pageCount = Math.ceil(filtered.length / consultationsPerPage);
    consultationPage = Math.min(consultationPage, Math.max(0, pageCount - 1));
    const start = consultationPage * consultationsPerPage;
    const pageConsultations = filtered.slice(start, start + consultationsPerPage);
    document.getElementById('consultation-list').innerHTML = pageConsultations.map(consultation => {
      const patient = PACIENTES.find(item => item.nome === consultation.paciente);
      const statusClass = consultation.status === 'agendada' || consultation.status === 'remarcada'
        ? 'badge-vinho'
        : consultation.status === 'cancelada' || consultation.status === 'nao_compareceu' ? 'badge-yellow' : 'badge-green';
      return `<button class="consultation-row" type="button" data-patient-id="${patient ? patient.id : ''}" data-consultation-id="${consultation.id}">
        <span class="consultation-date">${formatDate(consultation.data)}<br>${consultation.horario}</span>
        <span class="consultation-details"><span class="consultation-patient">${consultation.paciente}</span><br><span class="consultation-meta">${consultation.tipo} · ${consultation.protocolo}</span></span>
        <span class="badge ${statusClass}">${statusLabels[consultation.status] || consultation.status}</span>
      </button>`;
    }).join('') || '<p class="empty-state" style="padding:18px;">Não há consultas neste período.</p>';
    document.querySelectorAll('.consultation-row').forEach(row => row.addEventListener('click', () => Router.navigate('consultation', {
      patientId: role === 'patient' ? currentPatient.id : Number(row.dataset.patientId), consultationId:Number(row.dataset.consultationId)
    })));
    const pagination = document.getElementById('consultations-pagination');
    if (filtered.length <= consultationsPerPage) {
      pagination.replaceChildren();
      pagination.hidden = true;
      return;
    }
    const end = Math.min(start + consultationsPerPage, filtered.length);
    pagination.hidden = false;
    pagination.innerHTML = `<span>Mostrando ${start + 1}–${end} de ${filtered.length} consultas</span>
      <div class="financial-transactions-pagination-controls">
        <button type="button" data-page="${consultationPage - 1}" aria-label="Página anterior" ${consultationPage === 0 ? 'disabled' : ''}>‹</button>
        ${Array.from({ length:pageCount }, (_, index) => `<button type="button" data-page="${index}" aria-label="Página ${index + 1}" ${index === consultationPage ? 'aria-current="page"' : ''}>${index + 1}</button>`).join('')}
        <button type="button" data-page="${consultationPage + 1}" aria-label="Próxima página" ${consultationPage >= pageCount - 1 ? 'disabled' : ''}>›</button>
      </div>`;
    pagination.querySelectorAll('button[data-page]').forEach(button => button.addEventListener('click', () => {
      const requestedPage = Number(button.dataset.page);
      if (!Number.isInteger(requestedPage) || requestedPage < 0 || requestedPage >= pageCount) return;
      consultationPage = requestedPage;
      renderConsultations();
    }));
  }
  document.querySelectorAll('[data-period]').forEach(button => button.addEventListener('click', () => {
    consultationPeriod = button.dataset.period;
    consultationPage = 0;
    document.querySelectorAll('[data-period]').forEach(option => {
      const selected = option === button;
      option.classList.toggle('active', selected);
      option.setAttribute('aria-pressed', String(selected));
    });
    renderConsultations();
  }));
  document.querySelectorAll('[data-status-chip]').forEach(button => button.addEventListener('click', () => {
    document.getElementById('consult-status').value = button.dataset.statusChip;
    document.querySelectorAll('[data-status-chip]').forEach(option => {
      const selected = option === button;
      option.classList.toggle('active', selected);
      option.setAttribute('aria-pressed', String(selected));
    });
    consultationPage = 0;
    renderConsultations();
  }));
  [
    ['toggle-date-filters', 'consult-date-filters'],
    ['toggle-type-filters', 'consult-type-filters'],
  ].forEach(([buttonId, panelId]) => {
    const button = document.getElementById(buttonId);
    const panel = document.getElementById(panelId);
    button.addEventListener('click', () => {
      const expanded = button.getAttribute('aria-expanded') !== 'true';
      button.setAttribute('aria-expanded', String(expanded));
      panel.hidden = !expanded;
    });
  });
  document.getElementById('open-calendar').addEventListener('click', () => Router.navigate('agenda'));
  document.getElementById('consult-search').addEventListener('input', () => { consultationPage = 0; renderConsultations(); });
  document.getElementById('consult-status').addEventListener('change', () => { consultationPage = 0; renderConsultations(); });
  typeFilter.addEventListener('change', () => { consultationPage = 0; renderConsultations(); });
  protocolFilter.addEventListener('change', () => { consultationPage = 0; renderConsultations(); });
  document.getElementById('consult-date-from').addEventListener('change', () => { consultationPage = 0; renderConsultations(); });
  document.getElementById('consult-date-to').addEventListener('change', () => { consultationPage = 0; renderConsultations(); });
  document.getElementById('clear-consult-dates').addEventListener('click', () => {
    document.getElementById('consult-date-from').value = '';
    document.getElementById('consult-date-to').value = '';
    renderConsultations();
  });
  renderConsultations();

  }
</script>
<script src="../js/parity-enhancements.js"></script>
<script src="../js/round2-visual.js"></script>
<script src="../js/favicon.js" </script>
</body>
</html>
