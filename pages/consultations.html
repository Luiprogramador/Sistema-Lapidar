<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultas — Lapidar</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .consultations-layout { display:grid; grid-template-columns:minmax(280px, 0.9fr) minmax(380px, 1.3fr); gap:20px; }
    .consultation-list { display:flex; flex-direction:column; gap:8px; }
    .consultation-row { display:flex; align-items:center; gap:12px; width:100%; padding:12px; text-align:left; border:1px solid var(--border); border-radius:var(--radius); background:var(--white); cursor:pointer; transition:var(--transition); }
    .consultation-row:hover, .consultation-row:focus-visible { border-color:var(--vinho); background:var(--vinho-xlight); }
    .consultation-date { min-width:76px; color:var(--vinho); font-size:12px; font-weight:600; }
    .consultation-details { flex:1; min-width:0; }
    .consultation-patient { color:var(--text-primary); font-size:13px; font-weight:600; }
    .consultation-meta { color:var(--text-muted); font-size:11px; margin-top:3px; }
    .exam-summary-row { display:grid; grid-template-columns:minmax(120px, 1fr) 48px 48px minmax(50px, 65px) minmax(54px, 70px); gap:6px; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:12px; }
    .exam-summary-row:last-child { border-bottom:0; }
    .exam-summary-heading { color:var(--text-muted); font-size:10px; font-weight:600; text-transform:uppercase; }
    @media (max-width: 900px) { .consultations-layout { grid-template-columns:1fr; } }
    @media (max-width: 480px) { .exam-summary-row { grid-template-columns:minmax(80px, 1fr) 36px 36px 42px 44px; gap:3px; font-size:10px; } }
  </style>
</head>
<body>
<div id="topbar-container"></div>
<div id="sidebar-container"></div>

<main class="main-content page-enter">
  <div class="page-header">
    <h1 class="page-title">Consultas</h1>
    <p class="page-subtitle">Atendimentos e resultados laboratoriais recentes</p>
  </div>

  <div class="grid-responsive-3" style="gap:12px;margin-bottom:20px;">
    <div class="card-stat"><span class="card-stat-label">Próximas consultas</span><span class="card-stat-value" id="upcoming-count">0</span><span class="card-stat-sub">Agendadas</span></div>
    <div class="card-stat"><span class="card-stat-label">Pacientes atendidas</span><span class="card-stat-value" id="patient-count">0</span><span class="card-stat-sub">Nesta lista</span></div>
    <div class="card-stat"><span class="card-stat-label">Exames no painel</span><span class="card-stat-value" id="exam-count">0</span><span class="card-stat-sub">Marcadores acompanhados</span></div>
  </div>

  <div class="consultations-layout">
    <section class="card" aria-labelledby="consultations-list-title">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;">
        <h2 id="consultations-list-title" style="font-size:14px;font-weight:600;color:var(--vinho);">Agenda de atendimentos</h2>
        <button class="btn btn-subtle btn-sm" onclick="Router.navigate('agenda')">Abrir calendário</button>
      </div>
      <div class="consultation-list" id="consultation-list"></div>
    </section>

    <section class="card" aria-labelledby="exam-summary-title">
      <div style="margin-bottom:12px;">
        <h2 id="exam-summary-title" style="font-size:14px;font-weight:600;color:var(--vinho);">Resumo dos exames recentes</h2>
        <p id="exam-dates" style="font-size:11px;color:var(--text-muted);margin-top:4px;">Valores demonstrativos do painel clínico</p>
      </div>
      <div class="exam-summary-row exam-summary-heading"><span>Exame</span><span style="text-align:right;">Ant.</span><span style="text-align:right;">Atual</span><span style="text-align:right;">Meta</span><span style="text-align:right;">Status</span></div>
      <div id="exam-summary-list"></div>
    </section>
  </div>
</main>
<div id="bottombar-container"></div>

<script src="../js/data.js"></script>
<script src="../js/router.js"></script>
<script src="../js/components.js"></script>
<script>
  if (Router.getRole() !== 'doctor') {
    Router.navigate('agenda');
  } else {
  initShell('consultations');

  const today = new Date();
  const sortedConsultations = CONSULTAS.slice().sort((a, b) => (a.data + a.horario).localeCompare(b.data + b.horario));
  const patientNames = new Set(sortedConsultations.map(consultation => consultation.paciente));
  document.getElementById('upcoming-count').textContent = sortedConsultations.filter(consultation => consultation.status === 'agendada').length;
  document.getElementById('patient-count').textContent = patientNames.size;
  document.getElementById('exam-count').textContent = EXAMES_CATALOGO.length;
  if (EXAMES_CATALOGO.length) {
    document.getElementById('exam-dates').textContent = `Atual: ${EXAMES_CATALOGO[0].dataAtual} · Anterior: ${EXAMES_CATALOGO[0].dataAnterior} (dados demonstrativos)`;
  }

  document.getElementById('consultation-list').innerHTML = sortedConsultations.map(consultation => {
    const patient = PACIENTES.find(item => item.nome === consultation.paciente);
    const statusClass = consultation.status === 'agendada' ? 'badge-vinho' : 'badge-green';
    return `<button class="consultation-row" type="button" data-patient-id="${patient ? patient.id : ''}" data-consultation-id="${consultation.id}">
      <span class="consultation-date">${formatDate(consultation.data)}<br>${consultation.horario}</span>
      <span class="consultation-details"><span class="consultation-patient">${consultation.paciente}</span><br><span class="consultation-meta">${consultation.tipo} · ${consultation.protocolo}</span></span>
      <span class="badge ${statusClass}">${consultation.status}</span>
    </button>`;
  }).join('');

  document.querySelectorAll('.consultation-row').forEach(row => {
    row.addEventListener('click', () => Router.navigate('consultation', {
      patientId: Number(row.dataset.patientId),
      consultationId: Number(row.dataset.consultationId)
    }));
  });

  function getExamStatus(exam) {
    const value = parseFloat(String(exam.atual).replace(',', '.'));
    if (Number.isNaN(value)) return { label: 'Sem dado', color: 'var(--text-muted)' };
    if (exam.dir === 'max') {
      if (value <= exam.refMax) return { label: 'Na meta', color: 'var(--oliva)' };
      if (exam.warnThreshold && value <= exam.warnThreshold) return { label: 'Atenção', color: 'var(--yellow-text)' };
      return { label: 'Fora', color: 'var(--red-text)' };
    }
    if (exam.dir === 'min') {
      if (value >= exam.refMin) return { label: 'Na meta', color: 'var(--oliva)' };
      if (exam.warnThreshold && value >= exam.warnThreshold) return { label: 'Atenção', color: 'var(--yellow-text)' };
      return { label: 'Fora', color: 'var(--red-text)' };
    }
    if (exam.dir === 'range') {
      if (value >= exam.refMin && value <= exam.refMax) return { label: 'Na meta', color: 'var(--oliva)' };
      return { label: 'Atenção', color: 'var(--yellow-text)' };
    }
    return { label: 'Informativo', color: 'var(--text-muted)' };
  }

  document.getElementById('exam-summary-list').innerHTML = EXAMES_CATALOGO.map(exam => {
    const status = getExamStatus(exam);
    return `<div class="exam-summary-row">
      <span><strong style="color:var(--text-primary);">${exam.nome}</strong><span style="display:block;color:var(--text-muted);font-size:10px;">${exam.unidade}</span></span>
      <span style="text-align:right;color:var(--text-muted);">${exam.anterior}</span>
      <span style="text-align:right;font-weight:600;color:${status.color};">${exam.atual}</span>
      <span style="text-align:right;color:var(--text-secondary);font-size:10px;">${exam.meta}</span>
      <span style="text-align:right;color:${status.color};font-size:10px;font-weight:600;">${status.label}</span>
    </div>`;
  }).join('');
  }
</script>
</body>
</html>
