<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda — Lapidar</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .agenda-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
    }
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .cal-month-title {
      font-family: var(--font-serif);
      font-size: 16px;
      color: var(--vinho);
      font-weight: 500;
    }
    .cal-nav-btn {
      width: 32px; height: 32px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .cal-nav-btn:hover { background: var(--bege); color: var(--vinho); }
    @media (max-width: 900px) {
      .agenda-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="topbar-container"></div>
<div id="sidebar-container"></div>

<main class="main-content page-enter">
  <div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;">
    <div>
      <h1 class="page-title" id="agenda-title">Agenda</h1>
      <p class="page-subtitle" id="agenda-subtitle">Visualize e gerencie as consultas</p>
    </div>
    <button class="btn btn-primary" id="btn-nova-consulta">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nova Consulta
    </button>
  </div>

  <div class="agenda-layout">
    <!-- Calendário -->
    <div class="card" style="align-self:start;">
      <div class="cal-nav">
        <button class="cal-nav-btn" id="prev-month">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="cal-month-title" id="month-title"></span>
        <button class="cal-nav-btn" id="next-month">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="calendar-grid" id="cal-header"></div>
      <div class="calendar-grid" id="cal-days"></div>

      <!-- Legenda -->
      <div style="display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--text-muted);">
        <div style="display:flex;align-items:center;gap:6px;">
          <div style="width:8px;height:8px;border-radius:50%;background:var(--vinho);"></div>
          Hoje
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <div style="width:8px;height:8px;border-radius:50%;background:var(--dourado);"></div>
          Com consulta
        </div>
      </div>
    </div>

    <!-- Lista de consultas -->
    <div>
      <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <h3 style="font-size:13px;font-weight:600;color:var(--vinho);" id="consult-day-title">Consultas do dia</h3>
          <span class="badge badge-vinho" id="consult-count"></span>
        </div>
        <div id="consult-list" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>

      <!-- Alertas da agenda -->
      <div class="card" id="attention-panel">
        <h3 style="font-size:13px;font-weight:600;color:var(--vinho);margin-bottom:4px;">Atenção e Contatos Operacionais</h3>
        <p style="font-size:11px;color:var(--text-muted);margin-bottom:14px;">Pacientes que precisam de acompanhamento prioritário</p>
        <div style="display:flex;flex-direction:column;gap:10px;" id="attention-list"></div>
      </div>
    </div>
  </div>
</main>

<div id="bottombar-container"></div>

<!-- Modal nova consulta -->
<div class="modal-overlay" id="modal-consulta">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Nova Consulta</span>
      <button class="modal-close" id="close-modal-consulta">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Paciente *</label>
          <select class="form-select" id="modal-select-paciente">
            <option value="">Selecionar paciente...</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Data *</label>
          <input type="date" class="form-input" id="modal-data">
        </div>
        <div class="form-group">
          <label class="form-label">Horário *</label>
          <input type="time" class="form-input" value="09:00">
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Tipo de consulta</label>
          <select class="form-select">
            <option>Retorno</option>
            <option>Primeira consulta</option>
            <option>Bioimpedância</option>
            <option>Exames</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-subtle" id="cancel-modal-consulta">Cancelar</button>
      <button class="btn btn-primary" id="save-consulta">Agendar</button>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/router.js"></script>
<script src="../js/components.js"></script>
<script>
  initShell('agenda');

  const role = Router.getRole();
  const selectedPatient = Router.getSelectedPatient() || PACIENTES[0];
  const isPatientView = role === 'patient';

  if (isPatientView) {
    document.getElementById('agenda-title').textContent = 'Minhas Consultas';
    document.getElementById('agenda-subtitle').textContent = 'Consulte seus próximos atendimentos e o histórico';
    document.getElementById('btn-nova-consulta').hidden = true;
    document.getElementById('attention-panel').hidden = true;
  }

  const DAYS_PT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const MONTHS_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  const today = new Date();
  let viewYear  = today.getFullYear();
  let viewMonth = today.getMonth();
  let selectedDate = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  const tipoColors = {
    'Retorno':          { bg:'#EDE9F8', text:'#5B2333' },
    'Primeira consulta':{ bg:'#E8F0E0', text:'#3A4E25' },
    'Bioimpedância':    { bg:'#FEF3C7', text:'#92400E' },
    'Exames':           { bg:'#E0F2FE', text:'#075985' },
  };

  function getVisibleConsultations() {
    return isPatientView
      ? CONSULTAS.filter(c => c.paciente === selectedPatient.nome)
      : CONSULTAS;
  }

  // Populate patient select in modal
  function populatePatientSelect() {
    const sel = document.querySelector('#modal-consulta select');
    PACIENTES.forEach(p => {
      sel.innerHTML += `<option value="${p.id}">${p.nome}</option>`;
    });
  }

  function getDaysWithConsults(year, month) {
    return new Set(
      getVisibleConsultations().filter(c => {
        const d = new Date(c.data + 'T00:00:00');
        return d.getFullYear() === year && d.getMonth() === month;
      }).map(c => parseInt(c.data.split('-')[2]))
    );
  }

  function renderCalendar() {
    const title = document.getElementById('month-title');
    title.textContent = `${MONTHS_PT[viewMonth]} ${viewYear}`;

    // Header days
    const calHeader = document.getElementById('cal-header');
    calHeader.innerHTML = DAYS_PT.map(d => `<div class="cal-header-day">${d}</div>`).join('');

    const firstDay  = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysWithConsults = getDaysWithConsults(viewYear, viewMonth);

    const calDays = document.getElementById('cal-days');
    calDays.innerHTML = '';

    // Empty cells before first day
    for (let i = 0; i < firstDay; i++) {
      calDays.innerHTML += `<div class="cal-day disabled other-month"></div>`;
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday    = dateStr === `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
      const isSelected = dateStr === selectedDate;
      const hasConsults = daysWithConsults.has(d);

      calDays.innerHTML += `
        <button class="cal-day ${isToday?'today':''} ${isSelected?'selected':''} ${hasConsults?'has-events':''}"
          data-date="${dateStr}" onclick="selectDate('${dateStr}')">${d}</button>`;
    }
  }

  function renderConsults() {
    const list = document.getElementById('consult-list');
    const countEl = document.getElementById('consult-count');
    const titleEl = document.getElementById('consult-day-title');

    const [y,m,d] = selectedDate.split('-');
    titleEl.textContent = `${parseInt(d)} de ${MONTHS_PT[parseInt(m)-1]} de ${y}`;

    const day = getVisibleConsultations()
      .filter(c => c.data === selectedDate)
      .sort((a,b) => a.horario.localeCompare(b.horario));

    countEl.textContent = `${day.length} consulta${day.length !== 1 ? 's' : ''}`;

    if (day.length === 0) {
      list.innerHTML = `<div class="empty-state" style="padding:24px 0;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><p>Nenhuma consulta neste dia.</p></div>`;
      return;
    }

    list.innerHTML = day.map(c => {
      const tc = tipoColors[c.tipo] || { bg:'#F3F4F6', text:'#374151' };
      const foundP = PACIENTES.find(p => p.nome === c.paciente);
      const pid = foundP ? foundP.id : 1;
      return `
        <div class="consult-item" onclick="Router.navigate('consultation', { patientId: ${pid}, consultationId: ${c.id} })" style="cursor:pointer;" title="Clique para abrir a consulta">
          <div class="consult-time">${c.horario}</div>
          <div style="flex:1;min-width:0;">
            <div class="consult-name">${c.paciente}</div>
            <div class="consult-tipo">${c.protocolo}</div>
          </div>
          <span class="badge" style="background:${tc.bg};color:${tc.text};">${c.tipo}</span>
          <span style="font-size:12px;color:var(--dourado);font-weight:600;margin-left:8px;">Abrir →</span>
        </div>`;
    }).join('');
  }

  function renderAttention() {
    const el = document.getElementById('attention-list');
    if (!el) return;

    el.innerHTML = `
      <div style="background:var(--vinho-xlight);border-left:3px solid var(--vinho);border-radius:var(--radius);padding:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span style="font-size:12px;font-weight:600;color:var(--vinho);">Contatos de Terça-feira</span>
          <span class="badge badge-vinho">${PROXIMOS_CONTATOS.length}</span>
        </div>
        <p style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">Rotina semanal da Dra. Andressa & Gabi</p>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${PROXIMOS_CONTATOS.map(ct => {
            const p = PACIENTES.find(x => x.nome === ct.paciente) || PACIENTES[0];
            return `
              <div style="display:flex;align-items:center;justify-content:space-between;background:var(--white);border-radius:var(--radius-sm);padding:8px 10px;font-size:12px;">
                <div>
                  <div style="font-weight:600;color:var(--vinho);">${ct.paciente}</div>
                  <div style="font-size:10px;color:var(--text-muted);">${ct.motivo}</div>
                </div>
                <button class="btn btn-subtle btn-sm" style="padding:4px 8px;font-size:11px;" onclick="Router.navigate('journey',{patientId:${p.id}})">
                  Jornada
                </button>
              </div>`;
          }).join('')}
        </div>
      </div>

      <div style="background:var(--yellow-bg);border-left:3px solid var(--yellow-text);border-radius:var(--radius);padding:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span style="font-size:12px;font-weight:600;color:var(--yellow-text);">Sem Resposta há +7 dias</span>
          <span class="badge badge-yellow">2 pacientes</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${[
            { nome: 'Fernanda Alves', dias: 9, tel: '(51) 94321-0987', id: 5 },
            { nome: 'Gabriela Torres', dias: 8, tel: '(71) 93210-9876', id: 6 }
          ].map(p => `
            <div style="display:flex;align-items:center;justify-content:space-between;background:var(--white);border-radius:var(--radius-sm);padding:8px 10px;font-size:12px;">
              <div>
                <div style="font-weight:600;color:var(--text-primary);">${p.nome}</div>
                <div style="font-size:10px;color:var(--yellow-text);font-weight:500;">Sem retorno há ${p.dias} dias</div>
              </div>
              <a href="https://wa.me/55${p.tel.replace(/\\D/g,'')}" target="_blank" class="btn btn-primary btn-sm" style="padding:4px 8px;font-size:11px;text-decoration:none;">
                WhatsApp
              </a>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  window.selectDate = function(dateStr) {
    selectedDate = dateStr;
    renderCalendar();
    renderConsults();
  };

  document.getElementById('prev-month').addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  document.getElementById('next-month').addEventListener('click', () => {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendar();
  });

  // Modal
  const modal = document.getElementById('modal-consulta');
  document.getElementById('btn-nova-consulta').addEventListener('click', () => {
    document.getElementById('modal-data').value = selectedDate;
    modal.classList.add('open');
  });
  document.getElementById('close-modal-consulta').addEventListener('click', () => modal.classList.remove('open'));
  document.getElementById('cancel-modal-consulta').addEventListener('click', () => modal.classList.remove('open'));
  document.getElementById('save-consulta').addEventListener('click', () => {
    modal.classList.remove('open');
    alert('Consulta agendada! (Demonstração)');
  });
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

  populatePatientSelect();
  renderCalendar();
  renderConsults();
  if (!isPatientView) renderAttention();
</script>
</body>
</html>
