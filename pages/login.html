<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lapidar — Login</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    body { background: var(--bege); }
    .login-shell {
      min-height: 100vh;
      display: flex;
    }
    /* Left panel */
    .login-left {
      width: 52%;
      background: linear-gradient(160deg, var(--vinho-dark) 0%, var(--vinho) 50%, var(--vinho-light) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 56px;
      position: relative;
      overflow: hidden;
    }
    .login-left::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 320px; height: 320px;
      border-radius: 50%;
      background: rgba(198,161,91,0.12);
    }
    .login-left::after {
      content: '';
      position: absolute;
      bottom: -60px; left: -60px;
      width: 240px; height: 240px;
      border-radius: 50%;
      background: rgba(198,161,91,0.08);
    }
    .login-left-inner {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 380px;
    }
    .login-logo-img {
      height: 44px;
      width: auto;
      filter: brightness(0) invert(1);
    }
    .login-tagline {
      font-size: 14px;
      color: rgba(244,239,231,0.7);
      line-height: 1.6;
      margin-bottom: 40px;
    }
    .login-divider {
      width: 48px; height: 1px;
      background: rgba(198,161,91,0.5);
      margin: 0 auto 32px;
    }
    .login-dr {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(198,161,91,0.3);
      border-radius: 12px;
      padding: 16px 20px;
    }
    .login-dr-avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(198,161,91,0.2);
      border: 2px solid rgba(198,161,91,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-size: 20px;
      color: var(--dourado);
      font-weight: 600;
    }
    .login-dr-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--bege);
    }
    .login-dr-crm {
      font-size: 12px;
      color: rgba(244,239,231,0.6);
    }

    /* Right panel */
    .login-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 40px;
      background: var(--bege);
    }
    .login-form-box {
      width: 100%;
      max-width: 400px;
    }
    .login-form-title {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 400;
      color: var(--vinho);
      margin-bottom: 6px;
    }
    .login-form-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }
    .form-icon-input {
      position: relative;
    }
    .form-icon-input svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .form-icon-input input {
      padding-left: 40px;
    }
    .forgot-link {
      font-size: 12px;
      color: var(--vinho);
      text-decoration: none;
      display: block;
      text-align: right;
      margin-top: 6px;
      transition: var(--transition);
    }
    .forgot-link:hover { text-decoration: underline; }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 10px;
      border: 1.5px solid var(--border-dark);
      border-radius: var(--radius);
      background: var(--white);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-google:hover { border-color: var(--vinho); color: var(--vinho); box-shadow: var(--shadow-sm); }
    .login-or {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      font-size: 12px;
      color: var(--text-muted);
    }
    .login-or::before, .login-or::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .login-form-fields {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .login-footer-text {
      margin-top: 32px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .login-left { display: none; }
      .login-right {
        padding: 32px 24px;
        background: var(--white);
      }
      .login-shell { background: var(--white); }
    }
  </style>
</head>
<body>
<div class="login-shell">
  <!-- Painel esquerdo -->
  <div class="login-left">
    <div class="login-left-inner page-enter">
      <div>
        <img src="../assets/logo_escrita_tp.png" alt="Lapidar" class="login-logo-img">
      </div>
      <p class="login-tagline">
        Medicina integrativa e personalizada para a saúde feminina em todas as fases da vida.
      </p>
      <div class="login-divider"></div>
      <div class="login-dr">
        <div class="login-dr-avatar">A</div>
        <div>
          <div class="login-dr-name">Dra. Andressa Gomide</div>
          <div class="login-dr-crm">CRM 12345/MG · Medicina Integrativa</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Painel direito (formulário) -->
  <div class="login-right">
    <div class="login-form-box page-enter">
      <h1 class="login-form-title">Bem-vinda de volta</h1>
      <p class="login-form-sub">Acesse sua conta para continuar</p>

      <div class="login-form-fields">
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <div class="form-icon-input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" class="form-input" id="email" placeholder="seu@email.com" value="andressa@lapidar.com.br">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Senha</label>
          <div class="form-icon-input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" class="form-input" id="senha" placeholder="••••••••" value="••••••••">
          </div>
          <a href="#" class="forgot-link">Esqueci minha senha</a>
        </div>

        <button class="btn btn-primary btn-full btn-lg" id="btn-entrar">
          Entrar
        </button>

        <div class="login-or">ou</div>

        <button class="btn-google" id="btn-google">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Entrar com Google
        </button>
      </div>

      <p class="login-footer-text">
        Protótipo de demonstração · Sistema Lapidar © 2026
      </p>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/router.js"></script>
<script>
  document.getElementById('btn-entrar').addEventListener('click', () => {
    Router.setRole('doctor');
    Router.navigate('dashboard');
  });
  document.getElementById('btn-google').addEventListener('click', () => {
    Router.setRole('doctor');
    Router.navigate('dashboard');
  });
</script>
</body>
</html>
