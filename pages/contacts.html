<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contatos — Lapidar</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/parity-overrides.css">
  <link rel="stylesheet" href="../css/extra-pages.css">
</head><body>
<div id="topbar-container"></div>
<div id="sidebar-container"></div>
<main class="main-content page-enter extra-page contacts-page">
  <div class="page-header"><h1 class="page-title">Contatos</h1><p class="page-subtitle">Pessoas que fazem parte do seu cuidado e da sua rotina.</p></div>
  <div class="contacts-toolbar">
    <label class="contacts-search-wrap">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <input id="contacts-search" class="form-input" type="search" placeholder="Buscar por nome" aria-label="Buscar por nome">
    </label>
    <div id="contact-filters" class="contact-filters"></div>
  </div>
  <p id="contacts-results" class="contacts-results"></p>
  <div id="contacts-grid" class="contacts-grid"></div>
</main>
<dialog id="contact-dialog" class="extra-modal"><div class="contact-dialog-content">
  <div class="extra-actions"><button type="button" class="btn btn-ghost" data-contact-dialog-close aria-label="Fechar">×</button></div>
  <h2 data-contact-dialog-name></h2><p data-contact-dialog-role></p><p data-contact-dialog-email></p>
  <button type="button" class="btn btn-primary btn-sm" data-contact-dialog-close>Fechar</button>
</div></dialog>
<script src="../js/demo-data.js"></script>
<script src="../js/data.js"></script>
<script src="../js/router.js"></script>
<script src="../js/components.js"></script>
<script src="../js/extra-pages.js"></script>
<script>initShell('contacts'); initExtraPage('contacts');</script>
<script src="../js/favicon.js" </script>
</body>
</html>
