<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha da Paciente — Lapidar</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <style>
    .bio-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      box-shadow: var(--shadow-sm);
    }
    .bio-card-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .bio-card-value {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 600;
      color: var(--vinho);
    }
    .bio-card-unit {
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 4px;
      font-weight: 400;
    }
    .bio-card-delta {
      font-size: 11px;
      font-weight: 500;
      margin-top: 4px;
    }
    .delta-pos { color: var(--oliva); }
    .delta-neg { color: var(--red-text); }

    /* Arquivos magazine-style cards */
    .file-card {
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--white);
      padding: 16px;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .file-card:hover {
      border-color: var(--vinho);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .file-card-preview {
      height: 90px;
      background: var(--vinho-xlight);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 12px;
      color: var(--vinho);
      border: 1px dashed rgba(89,27,28,0.2);
    }
    .file-card-title {
      font-weight: 600;
      font-size: 13.5px;
      color: var(--vinho);
      margin-bottom: 4px;
    }
    .file-card-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
      flex: 1;
    }
    .file-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .timeline-event-button {
      border: 0;
      background: transparent;
      padding: 0;
      color: inherit;
      text-align: left;
      cursor: pointer;
      border-radius: var(--radius-sm);
    }
    .timeline-event-button:hover .timeline-title,
    .timeline-event-button:focus-visible .timeline-title {
      color: var(--vinho);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .timeline-event-button:focus-visible {
      outline: 2px solid var(--dourado);
      outline-offset: 3px;
    }
    #tabs-nav {
      width: 100%;
      min-width: 0;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      cursor: grab;
      user-select: none;
    }
    #tabs-nav.is-dragging { cursor: grabbing; scroll-behavior: auto; }
    #tabs-nav .tab-item {
      flex: 0 0 auto;
    }

    /* Print report styles */
    @media print {
      body { background: #fff !important; }
      #topbar-container, #sidebar-container, #bottombar-container,
      .top-actions-bar, .tabs, .no-print { display: none !important; }
      .main-content { margin: 0 !important; padding: 0 !important; }
      .print-header { display: block !important; margin-bottom: 20px; border-bottom: 2px solid #591B1C; padding-bottom: 12px; }
      .tab-content { display: block !important; margin-bottom: 24px; page-break-inside: avoid; }
      .tab-content[hidden] { display: none !important; }
      .card, .section-card, .bio-card { border: 1px solid #ccc !important; box-shadow: none !important; }
    }
    .print-header { display: none; }
  </style>
</head>
<body>
<div id="topbar-container"></div>
<div id="sidebar-container"></div>

<main class="main-content page-enter">

  <!-- Printable Header (Visible only when printing) -->
  <div class="print-header">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="../assets/logo_lapidar_tp.png" alt="Lapidar" style="height:36px;">
        <span style="font-family:var(--font-serif);font-size:24px;color:var(--vinho);font-weight:600;">Sistema Lapidar</span>
      </div>
      <div style="text-align:right;font-size:12px;color:#555;">
        <strong>Dra. Andressa Gomide</strong> · CRM 12345/MG<br>
        Relatório Clínico da Paciente
      </div>
    </div>
  </div>

  <!-- Back button + top actions bar -->
  <div class="top-actions-bar" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
    <button class="btn btn-subtle btn-sm" id="btn-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      <span id="back-label">Voltar para Pacientes</span>
    </button>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-subtle btn-sm" id="btn-print" onclick="window.print()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Imprimir Resumo (PDF)
      </button>
      <button class="btn btn-subtle btn-sm" id="btn-jornada">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Ver Jornada
      </button>
      <button class="btn btn-subtle btn-sm" id="btn-diario-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Diário Lapidar
      </button>
      <button class="btn btn-primary btn-sm" id="btn-consulta">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Iniciar Consulta
      </button>
    </div>
  </div>

  <!-- Patient header -->
  <div class="patient-header" id="patient-header"></div>

  <!-- Tabs Navigation -->
  <div class="tabs" id="tabs-nav">
    <button class="tab-item active" data-tab="painel">Painel Clínico</button>
    <button class="tab-item" data-tab="bio">Bioimpedância</button>
    <button class="tab-item" data-tab="score">Score Lapidar</button>
    <button class="tab-item" data-tab="risco">Risco CV</button>
    <button class="tab-item" data-tab="medicamentos">Medicamentos</button>
    <button class="tab-item" data-tab="arquivos">Arquivos</button>
    <button class="tab-item" data-tab="diario">Diário & Hábitos</button>
    <button class="tab-item" data-tab="timeline">Timeline</button>
  </div>

  <!-- Tab 1: Painel Clínico -->
  <div class="tab-content active" id="tab-painel"></div>

  <!-- Tab 2: Bioimpedância -->
  <div class="tab-content" id="tab-bio"></div>

  <!-- Tab 3: Score Lapidar -->
  <div class="tab-content" id="tab-score"></div>

  <!-- Tab 4: Risco CV -->
  <div class="tab-content" id="tab-risco"></div>

  <!-- Tab 5: Medicamentos & Suplementos -->
  <div class="tab-content" id="tab-medicamentos"></div>

  <!-- Tab 6: Arquivos (Estilo Revista) -->
  <div class="tab-content" id="tab-arquivos"></div>

  <!-- Tab 7: Diário & Hábitos -->
  <div class="tab-content" id="tab-diario"></div>

  <!-- Tab 8: Timeline -->
  <div class="tab-content" id="tab-timeline"></div>

</main>

<div id="bottombar-container"></div>

<!-- Modal Nova Bioimpedância -->
<div class="modal-overlay" id="modal-bio">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header">
      <span class="modal-title">Registrar Nova Bioimpedância</span>
      <button class="modal-close" onclick="closeModalBio()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Data *</label>
          <input type="date" class="form-input" id="bio-in-data">
        </div>
        <div class="form-group">
          <label class="form-label">Peso (kg) *</label>
          <input type="number" step="0.1" class="form-input" id="bio-in-peso" placeholder="Ex: 73.5">
        </div>
        <div class="form-group">
          <label class="form-label">Músculo Esquelético (kg)</label>
          <input type="number" step="0.1" class="form-input" id="bio-in-musculo" placeholder="Ex: 30.1">
        </div>
        <div class="form-group">
          <label class="form-label">Massa Gorda (kg)</label>
          <input type="number" step="0.1" class="form-input" id="bio-in-gordura" placeholder="Ex: 30.5">
        </div>
        <div class="form-group">
          <label class="form-label">Taxa Gordura (%)</label>
          <input type="number" step="0.1" class="form-input" id="bio-in-tx" placeholder="Ex: 41.5">
        </div>
        <div class="form-group">
          <label class="form-label">Água Corporal (%)</label>
          <input type="number" step="0.1" class="form-input" id="bio-in-agua" placeholder="Ex: 45.8">
        </div>
        <div class="form-group">
          <label class="form-label">Taxa Metabólica Basal (kcal)</label>
          <input type="number" class="form-input" id="bio-in-tmb" placeholder="Ex: 1620">
        </div>
        <div class="form-group">
          <label class="form-label">Gordura Visceral (nível)</label>
          <input type="number" class="form-input" id="bio-in-visceral" placeholder="Ex: 8">
        </div>
        <div class="form-group">
          <label class="form-label">Nota Geral (0 a 10)</label>
          <input type="number" step="0.1" class="form-input" id="bio-in-nota" placeholder="Ex: 8.2">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-subtle" onclick="closeModalBio()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveNewBio()">Salvar Medição</button>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/charts.js"></script>
<script src="../js/router.js"></script>
<script src="../js/components.js"></script>
<script>
  if (Router.getRole() === 'secretary') {
    Router.navigate('patient-registration', { patientId: Router.getState().patientId || 1 });
  } else {
  initShell('patient-detail');

  // Load patient
  const p = Router.getSelectedPatient() || PACIENTES[0];
  const isDoctorView = Router.getRole() === 'doctor';
  const isPatientView = Router.getRole() === 'patient';
  const patientReleasesKey = 'lapidar-patient-releases-' + p.id;
  let patientReleases = {};
  try {
    patientReleases = JSON.parse(localStorage.getItem(patientReleasesKey)) || {};
  } catch(e) {}
  const riskReleased = patientReleases.riskCV === true;
  try {
    const savedBio = localStorage.getItem('lapidar-bio-' + p.id);
    if (savedBio) {
      const parsedBio = JSON.parse(savedBio);
      if (Array.isArray(parsedBio) && parsedBio.length) {
        p.bioimpedancia = parsedBio;
        p.pesoAtual = parsedBio[parsedBio.length - 1].peso;
      }
    }
  } catch(e) {}
  const bio = p.bioimpedancia;
  const latestBio = bio[bio.length - 1];
  const prevBio   = bio[bio.length - 2] || null;

  // Buttons navigation
  if (isPatientView) {
    document.getElementById('btn-back').hidden = true;
    document.getElementById('btn-jornada').hidden = true;
    document.getElementById('btn-consulta').hidden = true;
  } else {
    document.getElementById('back-label').textContent = 'Voltar para Pacientes';
    document.getElementById('btn-back').addEventListener('click', () => {
      Router.navigate('patients', { patientId: p.id });
    });
  }
  document.getElementById('btn-consulta').addEventListener('click', () => {
    Router.navigate('consultation', { patientId: p.id, consultationId: null });
  });
  document.getElementById('btn-jornada').addEventListener('click', () => {
    Router.navigate('journey', { patientId: p.id });
  });
  document.getElementById('btn-diario-link').addEventListener('click', () => {
    Router.navigate('habits', { patientId: p.id });
  });

  // ── Patient Header ──
  const pct = Math.round((p.metasConcluidas / (p.metas.length || 1)) * 100);
  document.getElementById('patient-header').innerHTML = `
    <div class="patient-header-inner">
      <div class="patient-header-avatar">${p.iniciais}</div>
      <div style="flex:1;">
        <div class="patient-header-name">${p.nome}</div>
        <div class="patient-header-meta">
          <span>${p.idade} anos · ${p.nascimento}</span>
          <span>${p.telefone}</span>
          <span>${p.consultaAtual}</span>
          <span>${getProtocolBadge(p.protocolo)}</span>
          <span id="patient-lead" style="color:var(--text-muted);" ${isPatientView ? 'hidden' : ''}>Lead: ${p.origemLead || 'Indicação'}</span>
        </div>
        <div style="font-size:13px;color:var(--text-secondary);margin-top:8px;">
          <strong>Objetivo:</strong> ${p.objetivo}
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:20px;margin-top:16px;">
          <div class="patient-header-stat">
            <div class="patient-header-stat-value">${p.pesoAtual} kg</div>
            <div class="patient-header-stat-label">Peso atual</div>
          </div>
          <div class="patient-header-stat">
            <div class="patient-header-stat-value">${p.meta} kg</div>
            <div class="patient-header-stat-label">Meta</div>
          </div>
          <div class="patient-header-stat">
            <div class="patient-header-stat-value">−${(p.pesoInicial - p.pesoAtual).toFixed(1)} kg</div>
            <div class="patient-header-stat-label">Perda total</div>
          </div>
          <div class="patient-header-stat">
            <div class="patient-header-stat-value">${pct}%</div>
            <div class="patient-header-stat-label">Metas atingidas</div>
          </div>
          <div class="patient-header-stat">
            <div class="patient-header-stat-value">${p.circunferenciaAbdominal || '84 cm'}</div>
            <div class="patient-header-stat-label">Circunf. Abdominal</div>
          </div>
          <div class="patient-header-stat">
            <div class="patient-header-stat-value">${p.pressao || '120/80'}</div>
            <div class="patient-header-stat-label">Pressão Arterial</div>
          </div>
        </div>
      </div>
    </div>`;

  // ── TAB 1: PAINEL CLÍNICO ──
  document.getElementById('tab-painel').innerHTML = `
    <div class="grid-responsive-4" style="gap:12px;margin-bottom:20px;">
      ${[
        { label:'Peso',               val:`${latestBio.peso} kg`,       delta: prevBio ? latestBio.peso - prevBio.peso : null, inv: true },
        { label:'IMC',                val:`${latestBio.imc}`,            delta: prevBio ? latestBio.imc - prevBio.imc : null,  inv: true },
        { label:'Massa Gorda',        val:`${latestBio.gordura} kg`,     delta: prevBio ? latestBio.gordura - prevBio.gordura : null, inv: true },
        { label:'Massa Magra',        val:`${latestBio.musculo} kg`,     delta: prevBio ? latestBio.musculo - prevBio.musculo : null, inv: false },
        { label:'Tx. Gordura',        val:`${latestBio.txGordura}%`,     delta: prevBio ? latestBio.txGordura - prevBio.txGordura : null, inv: true },
        { label:'Gordura Visceral',   val:`${latestBio.gorduraVisceral}`,delta: prevBio ? latestBio.gorduraVisceral - prevBio.gorduraVisceral : null, inv: true },
        { label:'Circunferência Abdominal', val: p.circunferenciaAbdominal || '84 cm', delta: null },
        { label:'Pressão Arterial',   val: p.pressao || '120/80 mmHg', delta: null },
      ].map(c => {
        let deltaHtml = '';
        if (c.delta !== null) {
          const improved = c.inv ? c.delta < 0 : c.delta > 0;
          const sign = c.delta > 0 ? '+' : '';
          const cls  = improved ? 'delta-pos' : 'delta-neg';
          deltaHtml = `<div class="bio-card-delta ${cls}">${sign}${c.delta.toFixed(1)} vs. anterior</div>`;
        }
        return `<div class="bio-card"><div class="bio-card-label">${c.label}</div><div class="bio-card-value">${c.val}</div>${deltaHtml}</div>`;
      }).join('')}
    </div>

    <div class="grid-responsive-2" style="gap:16px;">
      <div class="card">
        <h4 style="font-size:13px;font-weight:600;color:var(--vinho);margin-bottom:12px;">Parâmetros Clínicos & Hormonais</h4>
        <div style="display:flex;flex-direction:column;gap:10px;font-size:13px;">
          <div style="display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--border);">
            <span style="color:var(--text-muted);">Terapia de Reposição Hormonal (TRH)</span>
            <span style="font-weight:600;color:var(--vinho);">${p.trh}</span>
          </div>
          <div style="display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--border);">
            <span style="color:var(--text-muted);">Contraceptivo Atual</span>
            <span style="font-weight:500;">${p.contraceptivo}</span>
          </div>
          <div style="display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--border);">
            <span style="color:var(--text-muted);">Última Consulta Realizada</span>
            <span style="font-weight:500;">${p.ultimaConsulta}</span>
          </div>
          <div style="display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--border);">
            <span style="color:var(--text-muted);">Próxima Consulta Agendada</span>
            <span style="font-weight:600;color:var(--vinho);">${p.proximaConsulta}</span>
          </div>
          ${isPatientView ? '' : `<div style="display:flex;justify-content:space-between;">
            <span style="color:var(--text-muted);">Observações Clínicas</span>
            <span style="font-size:12px;color:var(--text-secondary);text-align:right;max-width:260px;">${p.observacoes}</span>
          </div>`}
        </div>
      </div>

      <div class="card">
        <h4 style="font-size:13px;font-weight:600;color:var(--vinho);margin-bottom:12px;">Metas da Jornada (${p.metasConcluidas}/${p.metas.length})</h4>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${p.metas.map((m, i) => `
            <div style="display:flex;align-items:center;gap:10px;font-size:13px;">
              <div style="width:18px;height:18px;border-radius:50%;border:2px solid ${i < p.metasConcluidas ? 'var(--oliva)' : 'var(--border)'};background:${i < p.metasConcluidas ? 'var(--oliva)' : 'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                ${i < p.metasConcluidas ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
              </div>
              <span style="color:${i < p.metasConcluidas ? 'var(--text-muted);text-decoration:line-through' : 'var(--text-primary)'};">${m}</span>
            </div>
          `).join('')}
        </div>
        <div style="margin-top:16px;">
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:6px;">
            <span>Adesão ao plano</span><span>${pct}%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:linear-gradient(90deg,var(--vinho),var(--oliva));"></div></div>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <h4 style="font-size:13px;font-weight:600;color:var(--vinho);margin-bottom:12px;">Medicamentos e Suplementos Atuais</h4>
      <div class="grid-responsive-2" style="gap:16px;">
        ${['Medicamento','Suplemento'].map(type => `
          <div>
            <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;">${type === 'Medicamento' ? 'Medicamentos' : 'Suplementos'}</div>
            ${(p.medicamentos || []).filter(item => item.tipo === type && !item.fim).map(item => `<div style="font-size:12px;padding:6px 0;border-bottom:1px solid var(--border);"><strong>${item.nome}</strong> · ${item.dose} · ${item.freq}</div>`).join('') || '<div style="font-size:12px;color:var(--text-muted);">Nenhum registro vigente.</div>'}
          </div>`).join('')}
      </div>
    </div>`;

  // ── TAB 2: BIOIMPEDÂNCIA ──
  const bioFields = [
    { key:'peso',            label:'Peso Total',          unit:'kg',   inv:true  },
    { key:'musculo',         label:'Massa Magra',         unit:'kg',   inv:false },
    { key:'gordura',         label:'Massa Gorda',         unit:'kg',   inv:true  },
    { key:'txGordura',       label:'Taxa de Gordura',     unit:'%',    inv:true  },
    { key:'gorduraVisceral', label:'Gordura Visceral',    unit:'',     inv:true  },
    { key:'aguaCorporal',    label:'Água Corporal Total', unit:'%',    inv:false },
    { key:'tmb',             label:'Taxa Metabólica Basal',unit:'kcal',inv:false },
    { key:'nota',            label:'Nota InBody / Score', unit:'/10',  inv:false },
  ];

          </div>
          <div class="file-card-meta">
            <span>${escapeFileText(f.data)} · ${escapeFileText(f.tamanho)}</span>
            ${f.externalFile
              ? `<button class="btn btn-subtle btn-sm" style="padding:3px 8px;font-size:11px;" type="button" data-external-file="${escapeFileText(f.id)}">Visualizar</button>`
              : `<button class="btn btn-subtle btn-sm" style="padding:3px 8px;font-size:11px;" type="button" data-file-title="${escapeFileText(f.titulo)}">Visualizar</button>`}
          </div>
        </div>
      `).join('');
    fileGrid.querySelectorAll('[data-external-file]').forEach(button => {
      button.addEventListener('click', function() {
        const file = externalFiles.find(item => String(item.id) === button.dataset.externalFile);
        if (!file || !file.dataUrl) {
          alert('O conteúdo deste arquivo não está disponível neste navegador.');
          return;
        }
        const link = document.createElement('a');
        link.href = file.dataUrl;
        link.target = '_blank';
        link.rel = 'noopener';
        link.click();
      });
    });
    fileGrid.querySelectorAll('[data-file-title]').forEach(button => {
      button.addEventListener('click', function() {
        const fileCard = button.closest('.file-card');
        const file = allFiles.find(item => String(item.id) === fileCard.dataset.fileId);
        if (file) openHistoryDetails({
          title:file.titulo,
          type:file.tipo,
          date:file.data,
          description:file.desc,
          file:file,
          fileRecord:true
        });
      });
    });
    filterFiles();
  }

  // Filter files by type and direction together.
  function filterFiles() {
    const type = document.getElementById('file-type-filter').value;
    const origin = document.getElementById('file-origin-filter').value;
    document.querySelectorAll('#files-grid .file-card').forEach(card => {
      const matchesType = !type || card.dataset.tipo === type;
      const matchesOrigin = !origin || card.dataset.origem === origin;
      card.style.display = matchesType && matchesOrigin ? 'flex' : 'none';
    });
  }
  document.getElementById('file-type-filter').addEventListener('change', filterFiles);
  document.getElementById('file-origin-filter').addEventListener('change', filterFiles);
  renderFileCards();

  if (isPatientView) {
    const uploadForm = document.getElementById('external-exam-form');
    const uploadInput = document.getElementById('external-exam-file');
    const uploadFeedback = document.getElementById('external-exam-feedback');
    document.getElementById('external-exam-date').value = new Date().toISOString().slice(0, 10);
    uploadForm.addEventListener('submit', function(event) {
      event.preventDefault();
      const file = uploadInput.files[0];
      if (!file) {
        uploadFeedback.textContent = 'Selecione o arquivo do exame.';
        uploadFeedback.style.color = 'var(--red-text)';
        return;
      }
      if (file.size > 2 * 1024 * 1024) {
        uploadFeedback.textContent = 'O arquivo excede o limite de 2 MB.';
        uploadFeedback.style.color = 'var(--red-text)';
        return;
      }
      const allowedTypes = ['application/pdf', 'image/jpeg', 'image/png'];
      if (!allowedTypes.includes(file.type)) {
        uploadFeedback.textContent = 'Formato não aceito. Envie um PDF, JPG ou PNG.';
        uploadFeedback.style.color = 'var(--red-text)';
        return;
      }
      const reader = new FileReader();
      reader.onerror = function() {
        uploadFeedback.textContent = 'Não foi possível ler o arquivo. Tente selecioná-lo novamente.';
        uploadFeedback.style.color = 'var(--red-text)';
      };
      reader.onload = function() {
        const dateValue = document.getElementById('external-exam-date').value;
        const [year, month, day] = dateValue.split('-');
        const newFile = {
          id:Date.now() + '-' + Math.random().toString(36).slice(2, 8),
          titulo:file.name,
          tipo:document.getElementById('external-exam-type').value,
          data:day + '/' + month + '/' + year,
          desc:document.getElementById('external-exam-notes').value.trim(),
          size:file.size,
          mimeType:file.type,
          dataUrl:reader.result
        };
        const nextFiles = externalFiles.concat(newFile);
        try {
          localStorage.setItem(externalFilesKey, JSON.stringify(nextFiles));
        } catch (error) {
          uploadFeedback.textContent = 'Não foi possível salvar. O armazenamento do navegador pode estar cheio.';
          uploadFeedback.style.color = 'var(--red-text)';
          return;
        }
        externalFiles = nextFiles;
        renderFileCards();
        uploadForm.reset();
        document.getElementById('external-exam-date').value = new Date().toISOString().slice(0, 10);
        uploadFeedback.textContent = 'Exame enviado e disponível para a equipe clínica.';
        uploadFeedback.style.color = 'var(--green-text)';
      };
      reader.readAsDataURL(file);
      uploadFeedback.textContent = 'Enviando exame…';
      uploadFeedback.style.color = 'var(--text-muted)';
    });
  }

  // ── TAB 7: DIÁRIO & HÁBITOS ──
  const d = p.diarioHoje || {};
  document.getElementById('tab-diario').innerHTML = `
    <div class="card" style="margin-bottom:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;">
        <div>
          <h4 style="font-size:14px;font-weight:600;color:var(--vinho);">Diário Lapidar — Monitoramento em Tempo Real</h4>
          <p style="font-size:12px;color:var(--text-muted);">Registro diário da paciente entre uma consulta e outra · Constância > perfeição</p>
        </div>
        <button class="btn btn-primary btn-sm" onclick="Router.navigate('habits',{patientId:${p.id}})">
          Abrir Diário Completo →
        </button>
      </div>

      <div class="grid-responsive-3" style="gap:14px;margin-bottom:18px;">
        <div style="border:1px solid var(--border);border-radius:var(--radius);padding:14px;background:var(--bege);">
          <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;">Movimento Hoje</div>
          <div style="font-size:15px;font-weight:600;color:var(--vinho);margin-top:4px;">
            Musculação: ${d.movimento?.musculacao === 'sim' ? '✓ Feito' : d.movimento?.musculacao === 'nao_programado' ? 'Descanso' : 'Não feito'}
          </div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">
            Cardio: ${d.movimento?.cardio === 'sim' ? '✓ Feito' : d.movimento?.cardio === 'nao_programado' ? 'Não programado' : 'Não feito'}
          </div>
        </div>

        <div style="border:1px solid var(--border);border-radius:var(--radius);padding:14px;background:var(--bege);">
          <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;">Sono & Descanso</div>
          <div style="font-size:15px;font-weight:600;color:var(--vinho);margin-top:4px;">
            ${d.sono?.duracao || '7h30'} (Nota: ${d.sono?.qualidade || 8}/10)
          </div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">
            ${d.sono?.despertares || '1'} despertar · Dormiu ${d.sono?.dormiu || '23:00'}
          </div>
        </div>

        <div style="border:1px solid var(--border);border-radius:var(--radius);padding:14px;background:var(--bege);">
          <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;">Disposição & Bem-Estar</div>
          <div style="font-size:15px;font-weight:600;color:var(--oliva);margin-top:4px;">
            Energia: ${d.bemEstar?.energia || 8}/10
          </div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">
            Estresse: ${d.bemEstar?.estresse || 3}/10 (baixo)
          </div>
        </div>
      </div>

      ${d.observacoes ? `
        <div style="background:var(--vinho-xlight);border-left:3px solid var(--vinho);border-radius:var(--radius);padding:12px;font-size:13px;color:var(--text-primary);">
          <strong>Observação registrada pela paciente:</strong> "${d.observacoes}"
        </div>
      ` : ''}
    </div>`;

  // ── TAB 8: TIMELINE ──
  const tlColors = { 'Consulta':'#591B1C','WhatsApp':'#25D366','Ligação':'#3B82F6','Exame':'#8B5CF6','Mensagem':'#F59E0B' };
  function timelineDateValue(date) {
    const [day, month, year] = date.split('/').map(Number);
    return new Date(year, month - 1, day).getTime();
  }
  const fileTimeline = (arquivos || []).map(file => ({
    tipo:'Arquivo',
    data:file.data,
    icone:file.icon || '📄',
    titulo:file.titulo,
    desc:file.desc || file.tipo,
    arquivo:file
  })).concat(externalFiles.map(file => ({
    tipo:'Arquivo',
    data:file.data,
    icone:file.tipo.indexOf('Cardiograma') >= 0 ? '💓' : '📄',
    titulo:file.titulo,
    desc:file.desc || file.tipo,
    arquivo:{
      id:file.id,
      titulo:file.titulo,
      tipo:'Exames',
      data:file.data,
      origem:isPatientView ? 'Enviado' : 'Recebido',
      tamanho:formatFileSize(file.size),
      icon:file.tipo.indexOf('Cardiograma') >= 0 ? '💓' : '📄',
      desc:file.desc || file.tipo,
      externalFile:true,
      dataUrl:file.dataUrl
    }
  })));
  const sortedTimeline = (p.timeline || []).concat(fileTimeline)
    .sort((a, b) => timelineDateValue(b.data) - timelineDateValue(a.data));
  const historyModal = document.createElement('div');
  historyModal.className = 'modal-overlay';
  historyModal.id = 'history-detail-modal';
  historyModal.setAttribute('role', 'dialog');
  historyModal.setAttribute('aria-modal', 'true');
  historyModal.setAttribute('aria-labelledby', 'history-modal-title');
  historyModal.innerHTML = `
    <div class="modal" style="max-width:560px;">
      <div class="modal-header">
        <span class="modal-title" id="history-modal-title"></span>
        <button class="modal-close" type="button" id="history-modal-close" aria-label="Fechar">×</button>
      </div>
      <div class="modal-body">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">
          <span class="badge badge-gray" id="history-modal-type"></span>
          <span style="font-size:12px;color:var(--text-muted);" id="history-modal-date"></span>
        </div>
        <p id="history-modal-description" style="font-size:13px;color:var(--text-secondary);line-height:1.6;"></p>
        <p id="history-modal-file-meta" style="font-size:11px;color:var(--text-muted);margin-top:12px;"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-subtle" type="button" id="history-modal-dismiss">Fechar</button>
        <button class="btn btn-primary" type="button" id="history-modal-action"></button>
      </div>
    </div>`;
  document.body.appendChild(historyModal);
  let currentHistoryItem = null;
  let lastHistoryTrigger = null;
  function closeHistoryDetails() {
    historyModal.classList.remove('open');
    if (lastHistoryTrigger) lastHistoryTrigger.focus();
  }
  function openHistoryDetails(item, trigger) {
    currentHistoryItem = item;
    lastHistoryTrigger = trigger || document.activeElement;
    document.getElementById('history-modal-title').textContent = item.title || 'Histórico da paciente';
    document.getElementById('history-modal-type').textContent = item.type || 'Atividade';
    document.getElementById('history-modal-date').textContent = item.date || '';
    document.getElementById('history-modal-description').textContent = item.description || 'Sem detalhes adicionais.';
    const fileMeta = document.getElementById('history-modal-file-meta');
    fileMeta.textContent = item.file
      ? [item.file.origem, item.file.tamanho].filter(Boolean).join(' · ')
      : '';
    const action = document.getElementById('history-modal-action');
    if (item.fileRecord) {
      action.textContent = item.file && item.file.externalFile ? 'Abrir arquivo' : 'Abrir biblioteca de arquivos';
    } else if (item.type === 'Exame') {
      action.textContent = 'Ver arquivos de exames';
    } else if (item.type === 'Consulta') {
      action.textContent = 'Ver painel clínico';
    } else {
      action.textContent = 'Ver Diário e Hábitos';
    }
    historyModal.classList.add('open');
    document.getElementById('history-modal-close').focus();
  }
  function activatePatientTab(tabName) {
    closeHistoryDetails();
    const tab = document.querySelector('#tabs-nav .tab-item[data-tab="' + tabName + '"]');
    if (tab && !tab.hidden) tab.click();
  }
  document.getElementById('history-modal-close').addEventListener('click', closeHistoryDetails);
  document.getElementById('history-modal-dismiss').addEventListener('click', closeHistoryDetails);
  historyModal.addEventListener('click', function(event) {
    if (event.target === historyModal) closeHistoryDetails();
  });
  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape' && historyModal.classList.contains('open')) closeHistoryDetails();
  });
  document.getElementById('history-modal-action').addEventListener('click', function() {
    if (!currentHistoryItem) return;
    if (currentHistoryItem.fileRecord && currentHistoryItem.file && currentHistoryItem.file.externalFile) {
      if (!currentHistoryItem.file.dataUrl) {
        alert('O conteúdo deste arquivo não está disponível neste navegador.');
        return;
      }
      window.open(currentHistoryItem.file.dataUrl, '_blank', 'noopener');
      closeHistoryDetails();
      return;
    }
    if (currentHistoryItem.fileRecord || currentHistoryItem.type === 'Exame') {
      activatePatientTab('arquivos');
      if (currentHistoryItem.fileRecord && currentHistoryItem.file) {
        document.getElementById('file-type-filter').value = currentHistoryItem.file.tipo === 'Exames' ? 'Exames' : '';
        document.getElementById('file-origin-filter').value = currentHistoryItem.file.origem || '';
        filterFiles();
        const card = fileGrid.querySelector('[data-file-id="' + CSS.escape(String(currentHistoryItem.file.id)) + '"]');
        if (card) card.scrollIntoView({ behavior:'smooth', block:'center' });
      } else {
        document.getElementById('file-type-filter').value = 'Exames';
        filterFiles();
      }
      return;
    }
    activatePatientTab(currentHistoryItem.type === 'Consulta' ? 'painel' : 'diario');
  });

  document.getElementById('tab-timeline').innerHTML = `
    <div class="timeline">
      ${sortedTimeline.map((ev, index) => `
        <div class="timeline-item">
          <div class="timeline-icon" style="background:${tlColors[ev.tipo]||'#78685A'}22;color:${tlColors[ev.tipo]||'#78685A'};">
            <span style="font-size:18px;">${escapeFileText(ev.icone)}</span>
          </div>
          <div class="timeline-content">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <button type="button" class="timeline-event-button timeline-title" data-history-index="${index}">${escapeFileText(ev.titulo)}</button>
              <span class="badge badge-gray">${escapeFileText(ev.tipo)}</span>
            </div>
            <div class="timeline-date">${escapeFileText(ev.data)}</div>
            <div class="timeline-body">${escapeFileText(ev.desc)}</div>
            <button type="button" class="btn btn-subtle btn-sm timeline-event-button" data-history-index="${index}" style="margin-top:8px;padding:4px 9px;font-size:11px;">Ver detalhes →</button>
          </div>
        </div>
      `).join('')}
    </div>`;
  document.querySelectorAll('#tab-timeline [data-history-index]').forEach(button => {
    button.addEventListener('click', function() {
      const event = sortedTimeline[Number(button.dataset.historyIndex)];
      if (event.arquivo) {
        openHistoryDetails({
          title:event.titulo,
          type:event.tipo + ' · ' + (event.arquivo.tipo || 'Arquivo'),
          date:event.data,
          description:event.desc,
          file:event.arquivo,
          fileRecord:true
        }, button);
        return;
      }
      openHistoryDetails({
        title:event.titulo,
        type:event.tipo,
        date:event.data,
        description:event.desc
      }, button);
    });
  });

  // Draw initial sparklines & radar
  setTimeout(() => {
    bioFields.forEach(f => {
      const c = document.getElementById(`spark-${f.key}`);
      if (c) drawSparkline(c, bio.map(b => b[f.key] || 0), f.inv ? '#591B1C' : '#59633D');
    });
    const rc = document.getElementById('radar-chart');
    if (rc) drawRadarChart(rc, p.scoreLabels, p.scoreAtual, p.scoreAnterior);
  }, 100);

  // ── Tabs switching logic ──
  const tabsNav = document.getElementById('tabs-nav');
  let tabsDrag = null;
  let suppressTabClick = false;
  tabsNav.addEventListener('pointerdown', event => {
    if (event.pointerType !== 'mouse' || event.button !== 0) return;
    tabsDrag = { pointerId:event.pointerId, startX:event.clientX, startScrollLeft:tabsNav.scrollLeft, moved:false };
    document.addEventListener('pointermove', moveTabsWithPointer);
    document.addEventListener('pointerup', stopTabsPointerDrag);
    document.addEventListener('pointercancel', stopTabsPointerDrag);
  });
  function moveTabsWithPointer(event) {
    if (!tabsDrag || event.pointerId !== tabsDrag.pointerId) return;
    const distance = event.clientX - tabsDrag.startX;
    if (!tabsDrag.moved && Math.abs(distance) > 4) {
      tabsDrag.moved = true;
      tabsNav.classList.add('is-dragging');
    }
    if (tabsDrag.moved) {
      tabsNav.scrollLeft = tabsDrag.startScrollLeft - distance;
      event.preventDefault();
    }
  }
  function stopTabsPointerDrag(event) {
    if (!tabsDrag || event.pointerId !== tabsDrag.pointerId) return;
    suppressTabClick = tabsDrag.moved;
    tabsNav.classList.remove('is-dragging');
    tabsDrag = null;
    document.removeEventListener('pointermove', moveTabsWithPointer);
    document.removeEventListener('pointerup', stopTabsPointerDrag);
    document.removeEventListener('pointercancel', stopTabsPointerDrag);
    if (suppressTabClick) {
      setTimeout(() => { suppressTabClick = false; }, 0);
    }
  }
  tabsNav.addEventListener('click', event => {
    if (!suppressTabClick) return;
    event.preventDefault();
    event.stopImmediatePropagation();
  }, true);

  document.querySelectorAll('#tabs-nav .tab-item').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#tabs-nav .tab-item').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      btn.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'nearest' });

      if (btn.dataset.tab === 'bio') {
        setTimeout(() => {
          bioFields.forEach(f => {
            const c = document.getElementById(`spark-${f.key}`);
            if (c) drawSparkline(c, bio.map(b => b[f.key] || 0), f.inv ? '#591B1C' : '#59633D');
          });
        }, 50);
      }
      if (btn.dataset.tab === 'score') {
        setTimeout(() => {
          const rc = document.getElementById('radar-chart');
          if (rc) drawRadarChart(rc, p.scoreLabels, p.scoreAtual, p.scoreAnterior);
        }, 50);
      }
    });
  });

  // Modal Bioimpedância
  function openModalBio() {
    if (!isDoctorView) return;
    document.getElementById('bio-in-data').value = new Date().toISOString().split('T')[0];
    document.getElementById('bio-in-tmb').value = latestBio.tmb || '';
    document.getElementById('modal-bio').classList.add('open');
  }
  function closeModalBio() {
    document.getElementById('modal-bio').classList.remove('open');
  }
  function saveNewBio() {
    if (!isDoctorView) return;
    const dataVal = document.getElementById('bio-in-data').value;
    const pesoVal = parseFloat(document.getElementById('bio-in-peso').value);
    if (!pesoVal) { alert('Informe ao menos o peso.'); return; }

    const baselineBio = p.bioimpedancia[0];
    const heightSquared = baselineBio && baselineBio.imc ? baselineBio.peso / baselineBio.imc : 2.6;
    const entry = {
      data: formatDate(dataVal),
      peso: pesoVal,
      musculo: parseFloat(document.getElementById('bio-in-musculo').value) || latestBio.musculo,
      gordura: parseFloat(document.getElementById('bio-in-gordura').value) || latestBio.gordura,
      imc: parseFloat((pesoVal / heightSquared).toFixed(1)),
      txGordura: parseFloat(document.getElementById('bio-in-tx').value) || latestBio.txGordura,
      aguaCorporal: parseFloat(document.getElementById('bio-in-agua').value) || latestBio.aguaCorporal,
      gorduraVisceral: parseInt(document.getElementById('bio-in-visceral').value) || latestBio.gorduraVisceral,
      tmb: parseFloat(document.getElementById('bio-in-tmb').value) || latestBio.tmb,
      nota: parseFloat(document.getElementById('bio-in-nota').value) || 8.0
    };

    p.bioimpedancia.push(entry);
    p.pesoAtual = pesoVal;
    try {
      localStorage.setItem('lapidar-bio-' + p.id, JSON.stringify(p.bioimpedancia));
      localStorage.setItem('lapidar-pacientes', JSON.stringify(PACIENTES));
    } catch(e) {}
    closeModalBio();
    alert('Nova bioimpedância registrada com sucesso!');
    location.reload();
  }
  }
</script>
</body>
</html>
