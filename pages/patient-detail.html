<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha da Paciente — Lapidar</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/parity-overrides.css">
  <style>
    .bio-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      box-shadow: var(--shadow-sm);
      position: relative;
      transition: var(--transition);
    }
    .bio-card:hover, .bio-card:focus-within { border-color: var(--dourado); box-shadow: var(--shadow-md); }
    .bio-card[role="button"] { cursor: pointer; }
    .bio-card:focus-visible { outline: 2px solid var(--dourado); outline-offset: 2px; }
    .bio-meta-line { font-size:11px; color:var(--text-muted); margin-top:6px; }
    .bio-meta-set { margin-top:7px; padding:0; color:var(--vinho); font-size:11px; font-weight:600; }
    .bio-goal-success { display:flex; align-items:center; gap:8px; padding:12px 14px; border-radius:var(--radius); margin:0 0 14px; color:var(--green-text); background:var(--green-bg); font-size:13px; font-weight:600; }
    .score-overview-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .score-panel { min-width:0; padding:22px; border:1px solid #ddcbbb; border-radius:16px; background:#fffdfa; box-shadow:0 2px 5px rgba(74,39,37,.06),0 8px 24px rgba(74,39,37,.045); }
    .score-panel-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; }
    .score-panel-heading h4 { color:#292124; font-size:17px; font-weight:750; }
    .score-panel-heading p { margin-top:4px; color:var(--text-secondary); font-size:13px; line-height:1.45; }
    .score-average-badge { flex:0 0 auto; padding:7px 10px; border:1px solid #bf9655; border-radius:8px; background:#f1e2bf; color:#775414; font-size:12px; font-weight:800; }
    .score-radar-canvas { display:block; width:100%; height:380px; }
    .score-radar-legend { display:flex; flex-wrap:wrap; gap:16px; margin-top:4px; color:#393235; font-size:13px; }
    .score-radar-legend span { display:inline-flex; align-items:center; gap:8px; }
    .score-legend-swatch { width:13px; height:13px; border-radius:4px; background:#4f4144; }
    .score-legend-swatch.current { background:#5b2333; }
    .score-average-canvas { display:block; width:100%; height:330px; }
    .score-indicators { margin-top:22px; }
    .score-indicators-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; color:#63585a; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
    .score-patient-note { margin:0 0 12px; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bege); color:var(--text-secondary); font-size:12px; }
    .score-dimensions { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .score-dimension-card { min-width:0; padding:18px; border:1px solid #ddcbbb; border-radius:15px; background:#fffdfa; box-shadow:0 2px 5px rgba(74,39,37,.045); }
    .score-dimension-card-header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
    .score-dimension-card h5 { min-width:0; color:#292124; font-size:16px; font-weight:750; }
    .score-dimension-card p { color:var(--text-secondary); font-size:12px; line-height:1.45; }
    .score-dimension-value { flex:0 0 auto; color:#292124; font-size:12px; font-weight:600; }
    .score-dimension-delta { display:inline-flex; align-items:center; gap:4px; margin-left:5px; padding:6px 9px; border:1px solid #86a18a; border-radius:8px; background:#dce9dd; color:#456b4c; font-size:11px; font-weight:800; white-space:nowrap; }
    .score-dimension-delta.negative { border-color:#c49699; background:#f2e1e2; color:#8b3942; }
    .score-dimension-delta.neutral { border-color:#aaa09e; background:#e8e1df; color:#554b4c; }
    .score-dimension-canvas { display:block; width:100%; height:128px; margin-top:12px; }
    @media (max-width:900px) { .score-dimensions { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:700px) {
      .score-overview-grid,.score-dimensions { grid-template-columns:minmax(0,1fr); }
      .score-panel { padding:16px; }
      .score-radar-canvas { height:330px; }
      .score-average-canvas { height:260px; }
    }
    @media (max-width:420px) {
      .score-dimension-card { padding:14px; }
      .score-dimension-card h5 { font-size:14px; }
      .score-dimension-delta { padding:5px 7px; font-size:10px; }
    }
    .clinical-visit-dates { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; padding:4px 0 8px; border-bottom:1px solid var(--border); }
    .clinical-visit-dates div { display:flex; flex-direction:column; gap:2px; min-width:0; }
    .clinical-visit-dates span { color:var(--text-muted); font-size:11px; }
    .clinical-visit-dates strong { color:var(--text-primary); font-size:13px; font-weight:600; overflow-wrap:anywhere; }
    .bio-chart-canvas { display:block; width:100%; height:280px; }
    @media (max-width:640px) { .score-dimensions { grid-template-columns:1fr; } }
    .bio-card-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .bio-card-value {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 600;
      color: var(--vinho);
    }
    .bio-card-unit {
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 4px;
      font-weight: 400;
    }
    .bio-card-delta {
      font-size: 11px;
      font-weight: 500;
      margin-top: 4px;
    }
    .delta-pos { color: var(--oliva); }
    .delta-neg { color: var(--red-text); }

    /* Arquivos magazine-style cards */
    .file-card {
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--white);
      padding: 16px;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .file-card:hover {
      border-color: var(--vinho);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .file-card-preview {
      height: 90px;
      background: var(--vinho-xlight);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 12px;
      color: var(--vinho);
      border: 1px dashed rgba(91,35,51,0.2);
    }
    .file-card-title {
      font-weight: 600;
      font-size: 13.5px;
      color: var(--vinho);
      margin-bottom: 4px;
    }
    .file-card-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
      flex: 1;
    }
    .file-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .timeline-event-button {
      border: 0;
      background: transparent;
      padding: 0;
      color: inherit;
      text-align: left;
      cursor: pointer;
      border-radius: var(--radius-sm);
    }
    .timeline-event-button:hover .timeline-title,
    .timeline-event-button:focus-visible .timeline-title {
      color: var(--vinho);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .timeline-event-button:focus-visible {
      outline: 2px solid var(--dourado);
      outline-offset: 3px;
    }
    .timeline-toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .timeline-toolbar button, .timeline-toolbar select, .timeline-toolbar input { min-height:42px; }
    .timeline-toolbar .timeline-date-control { display:flex; align-items:center; gap:8px; }
    .timeline-count { width:100%; margin:2px 0 0; color:var(--text-secondary); font-size:12px; }
    .timeline-bulk-actions { display:flex; gap:16px; margin:0 0 16px; }
    .timeline-bulk-actions button { padding:0; border:0; background:transparent; color:var(--vinho); font-size:12px; font-weight:600; cursor:pointer; }
    .timeline-day { position:relative; padding:0 0 14px 54px; }
    .timeline-day::before { position:absolute; top:40px; bottom:0; left:21px; width:3px; border-radius:2px; background:#d7c8c0; content:''; }
    .timeline-day:last-child::before { display:none; }
    .timeline-day-header { position:relative; display:flex; align-items:center; gap:8px; min-height:40px; margin:0 0 8px; }
    .timeline-day-marker { position:absolute; top:0; left:-50px; display:flex; width:46px; height:48px; flex-direction:column; align-items:center; justify-content:center; border-radius:12px; background:var(--vinho); color:#fff; line-height:1; }
    .timeline-day-marker strong { font-family:var(--font-serif); font-size:18px; }
    .timeline-day-marker span { margin-top:2px; font-size:10px; font-weight:700; text-transform:uppercase; }
    .timeline-day-title { min-width:0; flex:1; color:#292124; font-size:14px; font-weight:750; }
    .timeline-day-count { display:inline-flex; min-width:28px; height:30px; align-items:center; justify-content:center; border:1px solid #a67982; border-radius:8px; background:#ead7da; color:#69414a; font-size:13px; }
    .timeline-day-toggle { width:28px; height:30px; padding:0; border:0; background:transparent; color:#55484a; font-size:17px; cursor:pointer; }
    .timeline-day-events { display:grid; gap:8px; }
    .timeline-event-card { display:grid; grid-template-columns:38px minmax(0,1fr) 24px; align-items:start; gap:10px; width:100%; min-width:0; padding:12px; border:1px solid #cdb8ae; border-radius:13px; background:#fffdfa; text-align:left; cursor:pointer; }
    .timeline-event-card:hover, .timeline-event-card:focus-visible { border-color:var(--vinho); box-shadow:0 3px 10px rgba(74,39,37,.08); }
    .timeline-event-icon { display:grid; width:36px; height:36px; place-items:center; border-radius:50%; background:#eee2e3; font-size:17px; }
    .timeline-event-copy { display:grid; min-width:0; gap:3px; }
    .timeline-event-title { color:#292124; font-size:14px; font-weight:750; line-height:1.4; overflow-wrap:anywhere; }
    .timeline-event-meta { color:var(--vinho); font-size:11px; font-weight:700; }
    .timeline-event-date { color:var(--text-secondary); font-size:12px; line-height:1.4; }
    .timeline-event-tag { justify-self:start; margin-top:4px; padding:5px 10px; border:1px solid #817775; border-radius:8px; background:#e7dedb; color:#41383a; font-size:11px; font-weight:650; }
    .timeline-event-chevron { justify-self:end; color:#514749; font-size:21px; line-height:1; }
    .timeline-empty { padding:22px; border:1px dashed var(--border-dark); border-radius:12px; color:var(--text-secondary); text-align:center; }
    @media (max-width:600px) {
      .timeline-toolbar { align-items:stretch; }
      .timeline-toolbar .timeline-date-control { flex:1 1 100%; }
      .timeline-toolbar .timeline-date-control input { min-width:0; flex:1; }
      .timeline-toolbar > select { width:100%; }
      .timeline-day { padding-left:46px; }
      .timeline-day::before { left:17px; }
      .timeline-day-marker { left:-44px; width:40px; height:44px; }
      .timeline-day-marker strong { font-size:16px; }
      .timeline-event-card { grid-template-columns:34px minmax(0,1fr) 18px; gap:8px; padding:10px; }
      .timeline-event-icon { width:32px; height:32px; font-size:15px; }
      .timeline-event-title { font-size:13px; }
    }
    #tabs-nav {
      width: 100%;
      min-width: 0;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      cursor: grab;
      user-select: none;
    }
    #tabs-nav.is-dragging { cursor: grabbing; scroll-behavior: auto; }
    #tabs-nav .tab-item {
      flex: 0 0 auto;
    }

    /* Print report styles */
    @media print {
      body { background: #fff !important; }
      #topbar-container, #sidebar-container,
      .top-actions-bar, .tabs, .no-print { display: none !important; }
      .main-content { margin: 0 !important; padding: 0 !important; }
      .print-header { display: block !important; margin-bottom: 20px; border-bottom: 2px solid #5B2333; padding-bottom: 12px; }
      .tab-content { display: block !important; margin-bottom: 24px; page-break-inside: avoid; }
      .tab-content[hidden] { display: none !important; }
      .card, .section-card, .bio-card { border: 1px solid #ccc !important; box-shadow: none !important; }
    }
    .print-header { display: none; }
  </style>
</head>
<body>
<div id="topbar-container"></div>
<div id="sidebar-container"></div>

<main class="main-content page-enter">

  <!-- Printable Header (Visible only when printing) -->
  <div class="print-header">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="../assets/logo_lapidar_tp.png" alt="Lapidar" style="height:36px;">
        <span style="font-family:var(--font-serif);font-size:24px;color:var(--vinho);font-weight:600;">Sistema Lapidar</span>
      </div>
      <div style="text-align:right;font-size:12px;color:#555;">
        <strong>Dra. Andressa Gomide</strong> · CRM 12345/MG<br>
        Relatório Clínico da Paciente
      </div>
    </div>
  </div>

  <!-- Back button + top actions bar -->
  <div class="top-actions-bar" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
    <button class="btn btn-subtle btn-sm" id="btn-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      <span id="back-label">Voltar para Pacientes</span>
    </button>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-subtle btn-sm" id="btn-print" onclick="window.print()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Imprimir Resumo (PDF)
      </button>
      <button class="btn btn-subtle btn-sm" id="btn-jornada">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Ver Jornada
      </button>
      <button class="btn btn-subtle btn-sm" id="btn-diario-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Diário Lapidar
      </button>
      <button class="btn btn-subtle btn-sm" id="btn-patient-profile" hidden>
        Meu perfil
      </button>
      <button class="btn btn-primary btn-sm" id="btn-consulta">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Iniciar Consulta
      </button>
    </div>
  </div>

  <!-- Patient header -->
  <div class="patient-header" id="patient-header"></div>

  <!-- Tabs Navigation -->
  <div class="tabs" id="tabs-nav">
    <button class="tab-item active" data-tab="timeline">Timeline</button>
    <button class="tab-item" data-tab="painel">Painel Clínico</button>
    <button class="tab-item" data-tab="consultas">Consultas</button>
    <button class="tab-item" data-tab="bio">Bioimpedância</button>
    <button class="tab-item" data-tab="diario">Diário Lapidar</button>
    <button class="tab-item" data-tab="score">Score Lapidar</button>
    <button class="tab-item" data-tab="risco">Risco Cardiovascular</button>
    <button class="tab-item" data-tab="medicamentos">Medicamentos e Suplementos</button>
    <button class="tab-item" data-tab="arquivos">Arquivos</button>
    <button class="tab-item" data-tab="jornada">Jornada operacional</button>
    <button class="tab-item" data-tab="relatorio">Relatório</button>
  </div>

  <!-- Tab 1: Painel Clínico -->
  <div class="tab-content" id="tab-painel"></div>

  <!-- Tab 2: Bioimpedância -->
  <div class="tab-content" id="tab-bio"></div>

  <!-- Tab 3: Score Lapidar -->
  <div class="tab-content" id="tab-score"></div>

  <!-- Tab 4: Risco CV -->
  <div class="tab-content" id="tab-risco"></div>

  <!-- Tab 5: Medicamentos & Suplementos -->
  <div class="tab-content" id="tab-medicamentos"></div>

  <!-- Tab 6: Arquivos (Estilo Revista) -->
  <div class="tab-content" id="tab-arquivos"></div>

  <!-- Tab 7: Diário & Hábitos -->
  <div class="tab-content" id="tab-diario"></div>

  <!-- Tab 8: Timeline -->
  <div class="tab-content active" id="tab-timeline"></div>
  <div class="tab-content" id="tab-consultas"></div>
  <div class="tab-content" id="tab-jornada"></div>
  <div class="tab-content" id="tab-relatorio"></div>

</main>


<!-- Modal Nova Bioimpedância -->
<div class="modal-overlay" id="modal-bio">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header">
      <span class="modal-title">Registrar Nova Bioimpedância</span>
      <button class="modal-close" onclick="closeModalBio()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Data *</label>
          <input type="date" class="form-input" id="bio-in-data">
        </div>
        <div class="form-group">
          <label class="form-label">Peso (kg) *</label>
          <input type="number" step="0.1" class="form-input" id="bio-in-peso" placeholder="Ex: 73.5">
        </div>
        <div class="form-group">
          <label class="form-label">Músculo Esquelético (kg)</label>
          <input type="number" step="0.1" class="form-input" id="bio-in-musculo" placeholder="Ex: 30.1">
        </div>
        <div class="form-group">
          <label class="form-label">Massa Gorda (kg)</label>
          <input type="number" step="0.1" class="form-input" id="bio-in-gordura" placeholder="Ex: 30.5">
        </div>
        <div class="form-group">
          <label class="form-label">Taxa Gordura (%)</label>
          <input type="number" step="0.1" class="form-input" id="bio-in-tx" placeholder="Ex: 41.5">
        </div>
        <div class="form-group">
          <label class="form-label">Água Corporal (%)</label>
          <input type="number" step="0.1" class="form-input" id="bio-in-agua" placeholder="Ex: 45.8">
        </div>
        <div class="form-group">
          <label class="form-label">Taxa Metabólica Basal (kcal)</label>
          <input type="number" class="form-input" id="bio-in-tmb" placeholder="Ex: 1620">
        </div>
        <div class="form-group">
          <label class="form-label">Gordura Visceral (nível)</label>
          <input type="number" class="form-input" id="bio-in-visceral" placeholder="Ex: 8">
        </div>
        <div class="form-group">
          <label class="form-label">Nota Geral (0 a 10)</label>
          <input type="number" step="0.1" class="form-input" id="bio-in-nota" placeholder="Ex: 8.2">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-subtle" onclick="closeModalBio()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveNewBio()">Salvar Medição</button>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/charts.js"></script>
<script src="../js/router.js"></script>
<script src="../js/components.js"></script>
<script>
  if (Router.getRole() === 'secretary') {
    Router.navigate('patient-registration', { patientId: Router.getState().patientId || 1 });
  } else {
  initShell('patient-detail');

  // Load patient
  const p = Router.getSelectedPatient() || PACIENTES[0];
  const isDoctorRole = Router.getRole() === 'doctor';
  // Flutter: só a médica administradora edita a ficha clínica (AuthSession.canEditChart).
  const isDoctorView = Router.can('editChart');
  const isPatientView = Router.getRole() === 'patient';
  const profileButton = document.getElementById('btn-patient-profile');
  profileButton.hidden = !isPatientView;
  profileButton.addEventListener('click', () => Router.navigate('patient-profile', { patientId:p.id }));
  const scoreHistoryKey = 'lapidar-score-history-' + p.id;
  let scoreHistory = [];
  try {
    const storedScores = JSON.parse(localStorage.getItem(scoreHistoryKey) || '[]');
    if (Array.isArray(storedScores)) scoreHistory = storedScores;
  } catch (error) {
    console.error('Não foi possível carregar o histórico do Score Lapidar.', error);
  }
  const isFortyPlus = p.protocolo === 'Lapidar 40+' || (Array.isArray(p.protocolos) && p.protocolos.includes('Lapidar 40+'));
  const scoreGoals = Array.isArray(p.metasPersonalizadas) ? p.metasPersonalizadas : [];
  const hasMovementScoreInput = scoreGoals.some(goal =>
    /muscul|treino|corrida|caminhada|cardio|atividade f[ií]sica|movimento|bike|bicicleta|natacao|natação/i.test([goal.nome,goal.tipo,goal.desc].join(' '))
  );
  const hasAdherenceScoreInput = scoreGoals.length > 0 || ['proteina','fibras','agua'].some(key => p.nutricaoMetas && p.nutricaoMetas[key]);
  const visibleScoreIndices = p.scoreLabels.map((_, index) => index).filter(index =>
    (isFortyPlus || ![6,7,8].includes(index)) &&
    (index !== 9 || hasMovementScoreInput) &&
    (index !== 10 || hasAdherenceScoreInput)
  );
  scoreHistory = scoreHistory.filter(entry =>
    entry && entry.source === 'diary' && Array.isArray(entry.values) &&
    typeof entry.date === 'string' &&
    visibleScoreIndices.every(index => Number.isFinite(entry.values[index]) && entry.values[index] >= 0 && entry.values[index] <= 10)
  );
  const visibleScoreLabels = visibleScoreIndices.map(index => p.scoreLabels[index]);
  if (scoreHistory.length) {
    scoreHistory.sort((a, b) => a.date.localeCompare(b.date));
    const latestScore = scoreHistory[scoreHistory.length - 1];
    const previousScore = scoreHistory.length > 1 ? scoreHistory[scoreHistory.length - 2] : null;
    p.scoreAtual = p.scoreAtual.slice();
    p.scoreAnterior = p.scoreAnterior.slice();
    p.scoreAtual = p.scoreAtual.map((value, index) =>
      Number.isFinite(latestScore.values[index]) ? latestScore.values[index] : value

    if (previousScore) {
      p.scoreAnterior = p.scoreAnterior.map((value, index) =>
        Number.isFinite(previousScore.values[index]) ? previousScore.values[index] : value

  }
  const scoreTrendEntries = scoreHistory.map(entry => ({

  if (!scoreTrendEntries.length) {

      { date:'', values:p.scoreAtual.slice(), label:'Atual' }

  const patientReleasesKey = 'lapidar-patient-releases-' + p.id;

  const riskReleased = patientReleases.riskCV === true;

          ${isDoctorRole ? '<button class="btn btn-primary btn-sm" id="patient-tab-new-consult">Nova consulta</button>' : ''}

  const hasInitialWeight = p.pesoInicial !== null && p.pesoInicial !== undefined && Number.isFinite(Number(p.pesoInicial));

  document.getElementById('patient-header').innerHTML = `
    <div class="patient-header-inner">
      <div class="patient-header-avatar">${p.iniciais}</div>
      <div style="flex:1;">
        <div class="patient-header-name">${p.nome}</div>

          <div class="patient-header-stat">

          </div>

      </div>

        { label:'Circunferência Abdominal', val: p.circunferenciaAbdominal || '84 cm', delta: null },

      }).join('')}
    </div>

    <div class="grid-responsive-2" style="gap:16px;">
      <div class="card">
        <h4 style="font-size:13px;font-weight:600;color:var(--vinho);margin-bottom:12px;">Parâmetros Clínicos & Hormonais</h4>
        <div style="display:flex;flex-direction:column;gap:10px;font-size:13px;">
          <div style="display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--border);">

        <div><strong style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">Alergias</strong><p style="font-size:13px;margin-top:4px;">${Array.isArray(p.alergias) && p.alergias.length ? p.alergias.map(escapeRiskText).join(', ') : 'Não informadas'}</p></div>
        <div><strong style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">Meta de peso</strong><p style="font-size:13px;margin-top:4px;">${hasWeightTarget ? escapeRiskText(p.meta) + ' kg' : 'Não definida'}</p></div>
        <div><strong style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">Metas personalizadas</strong><p style="font-size:13px;margin-top:4px;">${profileGoals.length ? profileGoals.map(goal => escapeRiskText(goal.nome) + (goal.freqDesejada ? ' · ' + escapeRiskText(goal.freqDesejada) : '')).join('<br>') : 'Nenhuma meta definida'}</p></div>
      </div>
      ${isDoctorView ? `<form id="patient-profile-form" hidden style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);" novalidate>
        <div class="form-grid">
          <label class="form-group" style="grid-column:1/-1;"><span class="form-label">Objetivo principal</span><input class="form-input" id="profile-objective" maxlength="240" value="${escapeRiskText(p.objetivo || '')}"></label>
          <label class="form-group"><span class="form-label">Meta de peso (opcional)</span><input class="form-input" id="profile-weight-goal" type="number" min="1" step="0.1" value="${hasWeightTarget ? Number(p.meta) : ''}"></label>
          <label class="form-group"><span class="form-label">Alergias (uma por linha)</span><textarea class="form-textarea" id="profile-allergies" rows="3">${escapeRiskText(Array.isArray(p.alergias) ? p.alergias.join('\n') : '')}</textarea></label>
          <label class="form-group" style="grid-column:1/-1;"><span class="form-label">Metas personalizadas</span><textarea class="form-textarea" id="profile-goals" rows="4">${escapeRiskText(profileGoals.map(goal => [goal.nome, goal.freqDesejada || '', goal.desc || ''].join(' | ')).join('\n'))}</textarea><small class="text-muted">Uma meta por linha: nome | frequência desejada | descrição (opcional). Deixe vazio para não atribuir metas.</small></label>
        </div>
        <p id="patient-profile-error" role="alert" hidden style="margin-top:8px;color:var(--red-text);font-size:12px;"></p>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;"><button class="btn btn-subtle btn-sm" type="button" id="cancel-patient-profile">Cancelar</button><button class="btn btn-primary btn-sm" type="submit">Salvar perfil</button></div>
      </form>` : ''}

  if (isDoctorView) {
    const profileForm = document.getElementById('patient-profile-form');
    document.getElementById('edit-patient-profile').addEventListener('click', () => { profileForm.hidden = false; });
    document.getElementById('cancel-patient-profile').addEventListener('click', () => { profileForm.hidden = true; });
    profileForm.addEventListener('submit', event => {
      event.preventDefault();
      const error = document.getElementById('patient-profile-error');
      const weightInput = document.getElementById('profile-weight-goal').value.trim();
      const weightGoal = weightInput ? Number(weightInput) : null;
      const goalLines = document.getElementById('profile-goals').value.split(/\r?\n/)
        .map(line => line.split('|').map(part => part.trim()))
        .filter(parts => parts[0]);
      const normalizedGoalNames = goalLines.map(parts => parts[0].toLocaleLowerCase('pt-BR'));
      if (weightInput && (!Number.isFinite(weightGoal) || weightGoal <= 0)) {
        error.textContent = 'A meta de peso deve ser um número maior que zero ou pode ficar vazia.';
        error.hidden = false;
        return;
      }
      if (goalLines.length > 20 || new Set(normalizedGoalNames).size !== normalizedGoalNames.length) {
        error.textContent = 'Informe no máximo 20 metas e use nomes diferentes para cada uma.';
        error.hidden = false;
        return;
      }
      const nextGoals = goalLines.map(([name, frequency, description], index) => {
        const existing = profileGoals.find(goal => goal.nome.toLocaleLowerCase('pt-BR') === name.toLocaleLowerCase('pt-BR'));
        return {
          id:existing?.id || 'goal-' + p.id + '-' + Date.now() + '-' + index,
          nome:name,
          freqDesejada:frequency || 'Conforme combinado',
          meta:existing?.meta || 1,
          realizado:existing?.realizado || 0,
          unidade:existing?.unidade || 'vezes',
          desc:description || '',
        };
      });
      const updatedPatient = {
        ...p,
        objetivo:document.getElementById('profile-objective').value.trim() || 'A definir',
        alergias:document.getElementById('profile-allergies').value.split(/\r?\n|,/).map(value => value.trim()).filter(Boolean),
        meta:weightGoal,
        metasPersonalizadas:nextGoals,
        metas:nextGoals.map(goal => goal.nome),
        metasConcluidas:Math.min(completedJourneyGoals, nextGoals.length),
      };
      const nextPatients = PACIENTES.map(patient => String(patient.id) === String(p.id) ? updatedPatient : patient);
      try {
        localStorage.setItem('lapidar-pacientes', JSON.stringify(nextPatients));
      } catch (storageError) {
        console.error('Não foi possível salvar o perfil clínico da paciente.', storageError);
        error.textContent = 'Não foi possível salvar o perfil neste navegador.';
        error.hidden = false;
        return;
      }
      PACIENTES.splice(0, PACIENTES.length, ...nextPatients);
      Object.assign(p, updatedPatient);
      location.reload();
    });
  }

  const patientConsultations = CONSULTAS
    .filter(consultation => consultation.paciente === p.nome)
    .sort((a, b) => b.data.localeCompare(a.data));
  document.getElementById('tab-painel').insertAdjacentHTML('beforeend', `
    <section class="card" style="margin-top:16px;" aria-labelledby="patient-consultation-history">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
        <div>
          <h4 id="patient-consultation-history" style="font-size:14px;font-weight:600;color:var(--vinho);">Histórico de Consultas</h4>
          <p style="font-size:12px;color:var(--text-muted);">Atendimentos registrados para ${p.nome}</p>
        </div>
        ${isDoctorRole ? '<button class="btn btn-primary btn-sm" id="patient-history-new-consult">Nova consulta</button>' : ''}
      </div>
      ${patientConsultations.length ? `<div style="display:flex;flex-direction:column;gap:8px;">
        ${patientConsultations.map(consultation => `
          <button type="button" class="patient-consultation-history-row" data-consultation-id="${consultation.id}" style="display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px;text-align:left;border:1px solid var(--border);border-radius:var(--radius);background:var(--white);cursor:pointer;">
            <span><strong style="display:block;color:var(--vinho);">${consultation.tipo}</strong><span style="font-size:11px;color:var(--text-muted);">${formatDate(consultation.data)} · ${consultation.horario}</span></span>
            <span class="badge ${consultation.status === 'concluida' ? 'badge-oliva' : 'badge-vinho'}">${consultation.status === 'concluida' ? 'Realizada' : 'Agendada'}</span>

  document.querySelectorAll('.patient-consultation-history-row').forEach(button => {
    button.addEventListener('click', () => Router.navigate('consultation', {
      patientId:p.id,

    }));

  const newConsultButton = document.getElementById('patient-history-new-consult');
  if (newConsultButton) newConsultButton.addEventListener('click', () => Router.navigate('consultation', {
    patientId:p.id,
    consultationId:null,
  }));

  // ── TAB 2: BIOIMPEDÂNCIA ──
  const bioFields = [
    { key:'peso',            label:'Peso Total',          unit:'kg',   inv:true  },
    { key:'musculo',         label:'Massa Magra',         unit:'kg',   inv:false },
    { key:'gordura',         label:'Massa Gorda',         unit:'kg',   inv:true  },
    { key:'txGordura',       label:'Taxa de Gordura',     unit:'%',    inv:true  },
    { key:'gorduraVisceral', label:'Gordura Visceral',    unit:'',     inv:true  },
    { key:'aguaCorporal',    label:'Água Corporal Total', unit:'%',    inv:false },
    { key:'tmb',             label:'Taxa Metabólica Basal',unit:'kcal',inv:false },
    { key:'nota',            label:'Nota InBody / Score', unit:'/10',  inv:false },
  ];

  const bioGoalsKey = 'lapidar-bio-metas-' + p.id;
  let bioGoals = { peso:Number(p.meta) };
  try {
    const savedGoals = JSON.parse(localStorage.getItem(bioGoalsKey) || '{}');
    if (savedGoals && typeof savedGoals === 'object') bioGoals = { ...bioGoals, ...savedGoals };
  } catch (error) {
    console.error('Não foi possível carregar as metas da bioimpedância.', error);
  }
  function bioGoalReached(field, value) {
    const target = Number(bioGoals[field.key]);
    if (!Number.isFinite(target)) return false;
    return field.inv ? value <= target : value >= target;
  }

  const bioReport = (p.arquivos || []).find(file => /bioimped|inbody/i.test(file.titulo + ' ' + file.desc));
  let bioHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
      <div>
        <h3 style="font-size:15px;font-weight:600;color:var(--vinho);">Evolução Segmental de Bioimpedância</h3>
        <p style="font-size:12px;color:var(--text-muted);">Data da última avaliação: <strong>${latestBio.data}</strong> (${bio.length} medições registradas)</p>
      </div>
      <button class="btn btn-primary btn-sm" id="btn-new-bio" onclick="openModalBio()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nova Bioimpedância
      </button>
    </div>
    <div class="grid-responsive-4" style="gap:16px;">`;

  bioFields.forEach(f => {
    const vals = bio.map(b => b[f.key] || 0);
    const last = vals[vals.length - 1];
    const prev2 = vals.length >= 2 ? vals[vals.length - 2] : null;
    const delta = prev2 !== null ? last - prev2 : null;
    const improved = delta !== null ? (f.inv ? delta < 0 : delta > 0) : null;
    const sign = delta > 0 ? '+' : '';
    const target = Number(bioGoals[f.key]);
    const hasTarget = Number.isFinite(target);
    const reached = hasTarget && bioGoalReached(f, last);
    bioHTML += `
      <div class="bio-card" data-bio-field="${f.key}" role="group" tabindex="0" aria-label="Abrir gráfico de ${f.label}">
        <div class="bio-card-label">${f.label}</div>
        <div class="bio-card-value">${last}<span class="bio-card-unit">${f.unit}</span></div>
        ${delta !== null ? `<div class="bio-card-delta ${improved ? 'delta-pos' : 'delta-neg'}">${sign}${delta.toFixed(1)} vs. anterior</div>` : '<div class="bio-card-delta delta-pos">— Estável</div>'}
        <canvas id="spark-${f.key}" style="width:100%;height:44px;margin-top:8px;display:block;"></canvas>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:4px;">
          <span>${bio[0].data}</span><span>${bio[bio.length-1].data}</span>
        </div>
        ${hasTarget ? `<div class="bio-meta-line">Meta: ${f.inv ? '≤' : '≥'} ${target}${f.unit}</div>` : '<div class="bio-meta-line">Meta ainda não definida</div>'}
        ${reached ? '<div class="badge badge-green" style="margin-top:7px;">Meta atingida</div>' : ''}
        ${isDoctorView ? `<button class="bio-meta-set" type="button" data-set-bio-goal="${f.key}">${hasTarget ? 'Ajustar meta' : 'Definir meta'}</button>` : ''}
      </div>`;
  });
  bioHTML += `</div>`;
  if (bioFields.some(field => bioGoalReached(field, Number(latestBio[field.key])))) {
    bioHTML = bioHTML.replace('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">',
      '<div class="bio-goal-success" role="status">🎉 Parabéns! Uma ou mais metas de bioimpedância foram atingidas.</div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">');
  }
  bioHTML += `<div class="card" style="margin-top:16px;">
    <h4 style="font-size:13px;font-weight:600;color:var(--vinho);margin-bottom:8px;">Arquivo de Bioimpedância</h4>
    ${bioReport ? `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;"><span style="font-size:12px;color:var(--text-secondary);">${bioReport.titulo} · ${bioReport.data}</span><button class="btn btn-subtle btn-sm" onclick="alert('Visualizando arquivo: ${bioReport.titulo}');">Visualizar</button></div>` : '<p style="font-size:12px;color:var(--text-muted);">Nenhum arquivo associado às medições.</p>'}
  </div>`;
  document.getElementById('tab-bio').innerHTML = bioHTML;
  if (!isDoctorView) document.getElementById('btn-new-bio').hidden = true;
  document.querySelectorAll('#tab-bio [data-bio-field]').forEach(card => {
    const openChart = () => showBioChart(card.dataset.bioField);
    card.addEventListener('click', event => {
      if (event.target.closest('[data-set-bio-goal]')) return;
      openChart();
    });
    card.addEventListener('keydown', event => {
      if ((event.key === 'Enter' || event.key === ' ') && event.target === card) {
        event.preventDefault();
        openChart();
      }
    });
  });
  document.querySelectorAll('#tab-bio [data-set-bio-goal]').forEach(button => {
    button.addEventListener('click', event => {
      event.stopPropagation();
      const field = bioFields.find(item => item.key === button.dataset.setBioGoal);
      if (!field) return;
      const current = bioGoals[field.key] ?? '';
      const value = prompt('Informe a meta para ' + field.label + (field.unit ? ' (' + field.unit + ')' : '') + ':', current);
      if (value === null) return;
      const target = Number(String(value).replace(',', '.'));
      if (!Number.isFinite(target)) {
        alert('Informe um valor numérico válido para a meta.');
        return;
      }
      bioGoals[field.key] = target;
      try {
        localStorage.setItem(bioGoalsKey, JSON.stringify(bioGoals));
        location.reload();
      } catch (error) {
        console.error('Não foi possível salvar a meta de bioimpedância.', error);
        alert('Não foi possível salvar a meta neste navegador.');
      }
    });
  });

  function showBioChart(fieldKey) {
    const field = bioFields.find(item => item.key === fieldKey);
    if (!field) return;
    let modal = document.getElementById('bio-chart-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'bio-chart-modal';
      modal.className = 'modal-overlay';
      modal.setAttribute('role', 'dialog');
      modal.setAttribute('aria-modal', 'true');
      document.body.appendChild(modal);
    }
    const goal = Number(bioGoals[field.key]);
    const hasGoal = Number.isFinite(goal);
    modal.innerHTML = `
      <div class="modal" style="max-width:760px;width:min(760px,94vw);">
        <div class="modal-header">
          <div><div class="modal-title">${field.label}</div><div style="font-size:12px;color:var(--text-muted);">${bio.length} medições · ${bio[0].data} – ${latestBio.data}</div></div>
          <button type="button" class="modal-close" aria-label="Fechar gráfico">×</button>
        </div>
        <div class="modal-body">
          <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px;color:var(--vinho);font-family:var(--font-serif);font-size:26px;font-weight:600;">${latestBio[field.key]}<span style="font:400 13px var(--font-sans);color:var(--text-muted);">${field.unit}</span></div>
          ${hasGoal ? `<p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">Meta: ${field.inv ? '≤' : '≥'} ${goal}${field.unit}</p>` : ''}
          <canvas class="bio-chart-canvas" id="bio-chart-large" aria-label="Gráfico de evolução de ${field.label}"></canvas>
        </div>
        <div class="modal-footer"><button class="btn btn-subtle" type="button">Fechar</button></div>
      </div>`;
    modal.classList.add('open');
    const close = () => modal.classList.remove('open');
    modal.querySelectorAll('.modal-close, .modal-footer button').forEach(button => button.addEventListener('click', close));
    modal.addEventListener('click', event => { if (event.target === modal) close(); }, { once:true });
    const canvas = modal.querySelector('#bio-chart-large');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    const values = bio.map(item => Number(item[field.key]) || 0);
    const min = Math.min(...values, hasGoal ? goal : Infinity);
    const max = Math.max(...values, hasGoal ? goal : -Infinity);
    const range = max - min || 1;
    const pad = { left:44, right:18, top:18, bottom:38 };
    const width = rect.width - pad.left - pad.right;
    const height = rect.height - pad.top - pad.bottom;
    const x = index => pad.left + (values.length < 2 ? width / 2 : index / (values.length - 1) * width);
    const y = value => pad.top + height - (value - min) / range * height;
    ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.font = '11px Montserrat, sans-serif';
    ctx.fillStyle = '#78685A';
    ctx.textAlign = 'right';
    [0, .5, 1].forEach(step => {
      const value = min + range * step;
      const lineY = y(value);
      ctx.strokeStyle = '#E3D8C8';
      ctx.beginPath(); ctx.moveTo(pad.left, lineY); ctx.lineTo(rect.width - pad.right, lineY); ctx.stroke();
      ctx.fillText(value.toFixed(1), pad.left - 7, lineY + 4);
    });
    if (hasGoal) {
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = '#66724A';
      ctx.beginPath(); ctx.moveTo(pad.left, y(goal)); ctx.lineTo(rect.width - pad.right, y(goal)); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.beginPath();
    values.forEach((value, index) => index ? ctx.lineTo(x(index), y(value)) : ctx.moveTo(x(index), y(value)));
    ctx.strokeStyle = '#5B2333'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke();
    values.forEach((value, index) => {
      ctx.beginPath(); ctx.arc(x(index), y(value), 4, 0, Math.PI * 2);
      ctx.fillStyle = '#5B2333'; ctx.fill();
      ctx.textAlign = index === 0 ? 'left' : index === values.length - 1 ? 'right' : 'center';
      ctx.fillStyle = '#78685A';
      ctx.fillText(bio[index].data, x(index), rect.height - 12);
    });
  }

  // ── TAB 3: SCORE LAPIDAR (11 Dimensões) ──
  const scoreInitialValues = scoreTrendEntries[0].values;
  const scoreCurrentValues = scoreTrendEntries[scoreTrendEntries.length - 1].values;
  const averageVisibleScores = values => visibleScoreIndices.length
    ? visibleScoreIndices.reduce((total, index) => total + Number(values[index] || 0), 0) / visibleScoreIndices.length
    : 0;
  const scoreAverageTrend = scoreTrendEntries.map(entry => ({
    value:averageVisibleScores(entry.values),
    label:entry.label,
  }));
  const currentScoreAverage = averageVisibleScores(scoreCurrentValues);
  document.getElementById('tab-score').innerHTML = `
    <div class="score-overview-grid">
      <section class="score-panel">
        <header class="score-panel-heading">
          <div>
            <h4>Radar do Score</h4>
            <p>Primeiro registro x registro atual (0 a 10)</p>
          </div>
        </header>
        <canvas id="radar-chart" class="score-radar-canvas" aria-label="Radar comparando o primeiro registro com o registro atual do Score Lapidar"></canvas>
        <div class="score-radar-legend">
          <span><i class="score-legend-swatch" aria-hidden="true"></i>Primeiro registro</span>
          <span><i class="score-legend-swatch current" aria-hidden="true"></i>Registro atual</span>
        </div>
      </section>
      <section class="score-panel">
        <header class="score-panel-heading">
          <div>
            <h4>Média geral</h4>
            <p>Calculado a partir do check-in do Diário</p>
          </div>
          <span class="score-average-badge" id="score-average-value">${currentScoreAverage.toFixed(1).replace('.', ',')} / 10</span>
        </header>
        <canvas id="score-average-chart" class="score-average-canvas" aria-label="Evolução da média geral do Score Lapidar ao longo dos check-ins"></canvas>
      </section>
    </div>
    <section class="score-indicators">
      <div class="score-indicators-heading">
        <span>Indicadores (0 a 10)</span>
        <button class="btn btn-subtle btn-sm" type="button" onclick="Router.navigate('habits',{patientId:${p.id}})">Ver Diário</button>
      </div>
      ${isPatientView ? '<p class="score-patient-note">Seus registros do Diário Lapidar atualizam estes indicadores automaticamente.</p>' : ''}
      <div class="score-dimensions">
        ${visibleScoreIndices.map(i => {
          const lbl = p.scoreLabels[i];
          const val = Number(scoreCurrentValues[i]) || 0;
          const initial = Number(scoreInitialValues[i]) || 0;
          const previousValues = scoreTrendEntries.length > 1
            ? scoreTrendEntries[scoreTrendEntries.length - 2].values
            : scoreInitialValues;
          const previous = Number(previousValues[i]) || 0;
          const previousDiff = val - previous;
          const initialDiff = val - initial;
          const initialSign = initialDiff > 0 ? '+' : '';
          const deltaClass = previousDiff > 0 ? '' : previousDiff < 0 ? ' negative' : ' neutral';
          const deltaLabel = previousDiff > 0 ? `↗ +${previousDiff} vs anterior` : previousDiff < 0 ? `↘ ${previousDiff} vs anterior` : '→ 0 vs anterior';
          const explanations = {
            Saciedade:'Percepção de saciedade nas refeições.',
            Fome:'Percepção de fome ao longo do dia.',
            Energia:'Nível de energia percebido.',
            Sono:'Qualidade percebida do sono.',
            Humor:'Bem-estar emocional percebido.',
            Libido:'Percepção de libido.',
            Fogachos:'Frequência ou intensidade percebida de fogachos.',
            'Perda urinária':'Percepção de sintomas urinários.',
            Constipação:'Percepção do funcionamento intestinal.',
            'Atividade física':'Consistência de atividade física relatada.',
            Adesão:'Percepção de adesão ao plano combinado.',
          };
          return `
            <article class="score-dimension-card">
              <div class="score-dimension-card-header">
                <h5>${lbl}</h5>
                <span class="score-dimension-delta${deltaClass}">${deltaLabel}</span>
              </div>
              <p>atual <span class="score-dimension-value">${val.toFixed(1).replace('.', ',')}/10</span> · desde o início ${initialSign}${initialDiff}</p>
              <canvas class="score-dimension-canvas" id="score-dimension-chart-${i}" aria-label="Histórico de ${lbl}"></canvas>
            </article>`;
        }).join('')}
      </div>
    </section>`;

  function drawScoreTrend(canvas, points, options = {}) {
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const width = rect.width;
    const height = rect.height;
    const compact = options.compact === true;
    const pad = compact
      ? { left:24, right:8, top:10, bottom:24 }
      : { left:34, right:10, top:26, bottom:34 };
    const chartWidth = width - pad.left - pad.right;
    const chartHeight = height - pad.top - pad.bottom;
    const values = points.length ? points.map(point => Math.max(0, Math.min(10, Number(point.value) || 0))) : [0];
    const x = index => pad.left + (values.length < 2 ? chartWidth / 2 : index / (values.length - 1) * chartWidth);
    const y = value => pad.top + chartHeight - value / 10 * chartHeight;
    const trace = () => {
      ctx.moveTo(x(0), y(values[0]));
      for (let index = 1; index < values.length; index++) {
        const midpoint = (x(index - 1) + x(index)) / 2;
        ctx.quadraticCurveTo(x(index - 1), y(values[index - 1]), midpoint, (y(values[index - 1]) + y(values[index])) / 2);
      }
      if (values.length > 1) ctx.lineTo(x(values.length - 1), y(values[values.length - 1]));
    };
    ctx.clearRect(0, 0, width, height);
    ctx.font = `${compact ? 10 : 11}px Montserrat, sans-serif`;
    ctx.textBaseline = 'middle';
    [0, 2, 4, 6, 8, 10].forEach(value => {
      const lineY = y(value);
      ctx.beginPath();
      ctx.strokeStyle = '#e7ddd2';
      ctx.lineWidth = 1;
      ctx.moveTo(pad.left, lineY);
      ctx.lineTo(width - pad.right, lineY);
      ctx.stroke();
      if (!compact || value === 0 || value === 5 || value === 10) {
        ctx.fillStyle = '#776b69';
        ctx.textAlign = 'right';
        ctx.fillText(String(value), pad.left - 7, lineY);
      }
    });
    if (options.goal !== undefined) {
      ctx.beginPath();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = '#6a866e';
      ctx.lineWidth = 1.5;
      ctx.moveTo(pad.left, y(options.goal));
      ctx.lineTo(width - pad.right, y(options.goal));
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#fffdfa';
      ctx.strokeStyle = '#9bb19c';
      ctx.beginPath();
      ctx.roundRect(pad.left + 4, y(options.goal) - 13, 42, 18, 5);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#456b4c';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = '700 10px Montserrat, sans-serif';
      ctx.fillText('meta 7', pad.left + 9, y(options.goal) - 4);
    }
    const gradient = ctx.createLinearGradient(0, pad.top, 0, height - pad.bottom);
    gradient.addColorStop(0, 'rgba(69, 105, 76, .22)');
    gradient.addColorStop(1, 'rgba(69, 105, 76, .015)');
    ctx.beginPath();
    trace();
    ctx.lineTo(x(values.length - 1), y(0));
    ctx.lineTo(x(0), y(0));
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.beginPath();
    trace();
    ctx.strokeStyle = '#3f6748';
    ctx.lineWidth = compact ? 2 : 2.5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
    if (compact) {
      values.forEach((value, index) => {
        if (index !== values.length - 1) return;
        ctx.beginPath();
        ctx.arc(x(index), y(value), 3, 0, Math.PI * 2);
        ctx.fillStyle = '#3f6748';
        ctx.fill();
      });
    } else {
      const labelIndices = [...new Set([0, Math.floor((values.length - 1) / 2), values.length - 1])];
      ctx.fillStyle = '#64595a';
      ctx.font = '600 10px Montserrat, sans-serif';
      ctx.textBaseline = 'alphabetic';
      labelIndices.forEach(index => {
        const label = points[index] && points[index].label || '';
        if (!label) return;
        ctx.textAlign = index === 0 ? 'left' : index === values.length - 1 ? 'right' : 'center';

    }

  function renderRiskHistory() {
    const canvas = document.getElementById('risk-history-chart');
    const records = riskHistory.map((record, index) => ({ record, index }))
      .filter(item => item.record && item.record.data)
      .sort((a, b) => String(a.record.data).localeCompare(String(b.record.data)));
    const width = Math.max(canvas.parentElement.clientWidth, 520);
    const height = 220;
    const ratio = window.devicePixelRatio || 1;
    canvas.width = width * ratio;
    canvas.height = height * ratio;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.clearRect(0, 0, width, height);
    const values = records.flatMap(({record}) => [record.ldl, record.metaLdl, record.naoHdl, record.metaNaoHdl])
      .map(Number).filter(Number.isFinite);
    if (records.length && values.length) {
      const max = Math.max(200, ...values) * 1.12;
      const pad = { left:38, right:18, top:14, bottom:34 };
      const chartWidth = width - pad.left - pad.right;
      const chartHeight = height - pad.top - pad.bottom;
      const x = index => pad.left + (records.length < 2 ? chartWidth / 2 : index * chartWidth / (records.length - 1));
      const y = value => pad.top + chartHeight - Number(value) / max * chartHeight;
      ctx.font = '10px Montserrat, sans-serif';
      ctx.textAlign = 'right';
      [0,.5,1].forEach(step => {
        const value = max * step;
        const lineY = y(value);
        ctx.strokeStyle = '#E3D8C8';
        ctx.beginPath(); ctx.moveTo(pad.left,lineY); ctx.lineTo(width-pad.right,lineY); ctx.stroke();
        ctx.fillStyle = '#78685A'; ctx.fillText(String(Math.round(value)),pad.left-6,lineY+3);
      });
      const series = [
        { key:'ldl', color:'#5B2333', dash:[] },
        { key:'metaLdl', color:'#3D6984', dash:[5,4] },
        { key:'naoHdl', color:'#A65A19', dash:[] },
        { key:'metaNaoHdl', color:'#66724A', dash:[5,4] },
      ];
      series.forEach(({key,color,dash}) => {
        let started = false;
        ctx.beginPath(); ctx.setLineDash(dash); ctx.strokeStyle = color; ctx.lineWidth = 2;
        records.forEach(({record}, index) => {
          const value = Number(record[key]);
          if (!Number.isFinite(value)) return;
          if (started) ctx.lineTo(x(index),y(value)); else { ctx.moveTo(x(index),y(value)); started = true; }
        });
        if (started) ctx.stroke();
        ctx.setLineDash([]);
        records.forEach(({record}, index) => {
          const value = Number(record[key]);
          if (!Number.isFinite(value)) return;
          ctx.beginPath(); ctx.arc(x(index),y(value),3,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();

          <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">
            Estresse: ${d.bemEstar?.estresse || 3}/10 (baixo)
          </div>
        </div>
      </div>

      ${d.observacoes ? `
        <div style="background:var(--vinho-xlight);border-left:3px solid var(--vinho);border-radius:var(--radius);padding:12px;font-size:13px;color:var(--text-primary);">
          <strong>Observação registrada pela paciente:</strong> "${d.observacoes}"
        </div>
      ` : ''}
    </div>`;

  // ── TAB 8: TIMELINE ──
  const tlColors = { 'Consulta':'#5B2333','WhatsApp':'#25D366','Ligação':'#3B82F6','Exame':'#8B5CF6','Mensagem':'#F59E0B','Diário':'#66724A' };
  function timelineDateValue(date) {
    const [day, month, year] = date.split('/').map(Number);
    return new Date(year, month - 1, day).getTime();
  }
  const fileTimeline = (arquivos || []).map(file => ({
    tipo:'Arquivo',
    data:file.data,
    icone:file.icon || '📄',
    titulo:file.titulo,
    desc:file.desc || file.tipo,
    arquivo:file
  }));
  let diaryTimeline = [];
  try {
    const diaryHistory = JSON.parse(localStorage.getItem('lapidar-diario-historico-' + p.id) || '{"events":[]}');
    diaryTimeline = (Array.isArray(diaryHistory.events) ? diaryHistory.events : []).map(event => {
      const eventDate = new Date(event.date + 'T12:00:00');
      const formattedDate = eventDate.toLocaleDateString('pt-BR');
      const changes = Array.isArray(event.changes) ? event.changes.map(change =>
        typeof change === 'string' ? change : change.label + ': ' + change.detail
      ) : [];
      return {
        tipo:event.type || 'Diário',
        data:formattedDate,
        icone:event.type === 'Score Lapidar' ? '◉' : '✦',
        titulo:event.title || 'Atualização do Diário Lapidar',
        desc:(event.time ? 'Atualizado às ' + event.time + '. ' : '') + (changes.length ? changes.join(' · ') : 'Check-in diário registrado.'),
      };
    });
  } catch (error) {
    console.error('Não foi possível carregar as alterações do diário para a timeline.', error);
  }
  const sortedTimeline = (p.timeline || []).concat(fileTimeline, diaryTimeline)
    .sort((a, b) => timelineDateValue(b.data) - timelineDateValue(a.data));
  const historyModal = document.createElement('div');
  historyModal.className = 'modal-overlay';
  historyModal.id = 'history-detail-modal';
  historyModal.setAttribute('role', 'dialog');
  historyModal.setAttribute('aria-modal', 'true');
  historyModal.setAttribute('aria-labelledby', 'history-modal-title');
  historyModal.innerHTML = `
    <div class="modal" style="max-width:560px;">
      <div class="modal-header">
        <span class="modal-title" id="history-modal-title"></span>
        <button class="modal-close" type="button" id="history-modal-close" aria-label="Fechar">×</button>
      </div>
      <div class="modal-body">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;">
          <span class="badge badge-gray" id="history-modal-type"></span>
          <span style="font-size:12px;color:var(--text-muted);" id="history-modal-date"></span>
        </div>
        <p id="history-modal-description" style="font-size:13px;color:var(--text-secondary);line-height:1.6;"></p>
        <p id="history-modal-file-meta" style="font-size:11px;color:var(--text-muted);margin-top:12px;"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-subtle" type="button" id="history-modal-dismiss">Fechar</button>
        <button class="btn btn-primary" type="button" id="history-modal-action"></button>
      </div>
    </div>`;
  document.body.appendChild(historyModal);
  let currentHistoryItem = null;
  let lastHistoryTrigger = null;
  function closeHistoryDetails() {
    historyModal.classList.remove('open');
    if (lastHistoryTrigger) lastHistoryTrigger.focus();
  }
  function openHistoryDetails(item, trigger) {
    currentHistoryItem = item;
    lastHistoryTrigger = trigger || document.activeElement;
    document.getElementById('history-modal-title').textContent = item.title || 'Histórico da paciente';
    document.getElementById('history-modal-type').textContent = item.type || 'Atividade';
    document.getElementById('history-modal-date').textContent = item.date || '';
    document.getElementById('history-modal-description').textContent = item.description || 'Sem detalhes adicionais.';
    const fileMeta = document.getElementById('history-modal-file-meta');
    fileMeta.textContent = item.file
      ? [item.file.origem, item.file.tamanho].filter(Boolean).join(' · ')
      : '';
    const action = document.getElementById('history-modal-action');
    if (item.fileRecord) {
      action.textContent = 'Abrir biblioteca de arquivos';
    } else if (item.type === 'Exame') {
      action.textContent = 'Ver arquivos de exames';
    } else if (item.type === 'Consulta') {
      action.textContent = 'Ver painel clínico';
    } else {
      action.textContent = 'Ver Diário e Hábitos';
    }
    historyModal.classList.add('open');
    document.getElementById('history-modal-close').focus();
  }
  function activatePatientTab(tabName) {
    closeHistoryDetails();
    const tab = document.querySelector('#tabs-nav .tab-item[data-tab="' + tabName + '"]');
    if (tab && !tab.hidden) tab.click();
  }
  document.getElementById('history-modal-close').addEventListener('click', closeHistoryDetails);
  document.getElementById('history-modal-dismiss').addEventListener('click', closeHistoryDetails);
  historyModal.addEventListener('click', function(event) {
    if (event.target === historyModal) closeHistoryDetails();
  });
  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape' && historyModal.classList.contains('open')) closeHistoryDetails();
  });
  document.getElementById('history-modal-action').addEventListener('click', function() {
    if (!currentHistoryItem) return;
    if (currentHistoryItem.fileRecord || currentHistoryItem.type === 'Exame') {
      activatePatientTab('arquivos');
      if (currentHistoryItem.fileRecord && currentHistoryItem.file) {
        document.getElementById('file-type-filter').value = currentHistoryItem.file.tipo === 'Exames' ? 'Exames' : '';
        document.getElementById('file-origin-filter').value = currentHistoryItem.file.origem || '';
        filterFiles();
        const card = fileGrid.querySelector('[data-file-id="' + CSS.escape(String(currentHistoryItem.file.id)) + '"]');
        if (card) card.scrollIntoView({ behavior:'smooth', block:'center' });
      } else {
        document.getElementById('file-type-filter').value = 'Exames';
        filterFiles();
      }
      return;
    }
    activatePatientTab(currentHistoryItem.type === 'Consulta' ? 'painel' : 'diario');
  });

  const timelineTab = document.getElementById('tab-timeline');
  const timelineTypes = [...new Set(sortedTimeline.map(event => event.tipo))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  const timelineDateLabel = date => {
    const [day, month, year] = date.split('/').map(Number);
    return new Date(year, month - 1, day, 12).toLocaleDateString('pt-BR', {
      weekday:'long', day:'numeric', month:'long',
    });
  };
  const timelineEventTime = event => {
    const match = String(event.desc || '').match(/(?:às|as)\s+(\d{1,2}:\d{2})/i);
    return event.horario || match && match[1] || '';
  };
  const renderTimeline = () => {
    const selectedType = document.getElementById('timeline-type-filter').value;
    const events = sortedTimeline
      .map((event, index) => ({ ...event, historyIndex:index }))
      .filter(event => !selectedType || event.tipo === selectedType);
    const groups = new Map();
    events.forEach(event => {
      if (!groups.has(event.data)) groups.set(event.data, []);
      groups.get(event.data).push(event);
    });
    const entries = [...groups.entries()];
    document.getElementById('timeline-count').textContent =
      `${events.length} evento(s) em ${entries.length} dia(s)`;
    const eventsContainer = document.getElementById('timeline-days');
    eventsContainer.innerHTML = entries.length ? entries.map(([date, dayEvents], dayIndex) => {
      const [day, month] = date.split('/');
      const monthLabel = new Date(Number(dayEvents[0].data.split('/')[2]), Number(month) - 1, Number(day), 12)
        .toLocaleDateString('pt-BR', { month:'short' }).replace('.', '').toUpperCase();
      return `
        <section class="timeline-day" data-timeline-date="${escapeFileText(date)}">
          <header class="timeline-day-header">
            <span class="timeline-day-marker"><strong>${escapeFileText(day)}</strong><span>${escapeFileText(monthLabel)}</span></span>
            <span class="timeline-day-title">${escapeFileText(timelineDateLabel(date))}</span>
            <span class="timeline-day-count">${dayEvents.length}</span>
            <button type="button" class="timeline-day-toggle" aria-expanded="true" aria-label="Recolher eventos de ${escapeFileText(timelineDateLabel(date))}" data-toggle-timeline-day="${dayIndex}">⌃</button>
          </header>
          <div class="timeline-day-events" data-timeline-events="${dayIndex}">
            ${dayEvents.map(event => {
              const time = timelineEventTime(event);
              return `<button type="button" class="timeline-event-card" data-history-index="${event.historyIndex}">
                <span class="timeline-event-icon" style="background:${tlColors[event.tipo] || '#78685A'}22;">${escapeFileText(event.icone || '•')}</span>
                <span class="timeline-event-copy">
                  <span class="timeline-event-title">${escapeFileText(event.titulo)}</span>
                  <span class="timeline-event-meta">${escapeFileText(event.tipo)}${time ? ` · ${escapeFileText(time)}` : ''}</span>
                  <span class="timeline-event-date">${escapeFileText(date)}${time ? ` às ${escapeFileText(time)}` : ''}</span>
                  <span class="timeline-event-tag">${escapeFileText(event.arquivo && event.arquivo.tipo || event.tipo)}</span>
                </span>
                <span class="timeline-event-chevron" aria-hidden="true">›</span>
              </button>`;
            }).join('')}
          </div>
        </section>`;
    }).join('') : '<div class="timeline-empty">Nenhum evento encontrado para esse tipo.</div>';
  };
  timelineTab.innerHTML = `
    <div class="timeline-toolbar">
      <div class="timeline-date-control">
        <input type="date" class="form-input" id="timeline-jump-date" aria-label="Escolher dia da timeline">
        <button type="button" class="btn btn-subtle" id="timeline-jump-button">▣ &nbsp; Ir para um dia</button>
      </div>
      <select class="form-select" id="timeline-type-filter" aria-label="Filtrar por tipo de evento">
        <option value="">☷ &nbsp; Tipo de evento</option>
        ${timelineTypes.map(type => `<option value="${escapeFileText(type)}">${escapeFileText(type)}</option>`).join('')}
      </select>
      <p class="timeline-count" id="timeline-count"></p>
    </div>
    <div class="timeline-bulk-actions">
      <button type="button" id="timeline-expand-all">Expandir tudo</button>
      <button type="button" id="timeline-collapse-all">Recolher tudo</button>
    </div>
    <div id="timeline-days"></div>`;
  renderTimeline();
  document.getElementById('timeline-type-filter').addEventListener('change', renderTimeline);
  document.getElementById('timeline-expand-all').addEventListener('click', () => {
    timelineTab.querySelectorAll('.timeline-day-events').forEach(events => { events.hidden = false; });
    timelineTab.querySelectorAll('.timeline-day-toggle').forEach(button => {
      button.setAttribute('aria-expanded', 'true');
      button.textContent = '⌃';
      button.setAttribute('aria-label', button.getAttribute('aria-label').replace('Expandir', 'Recolher'));
    });
  });
  document.getElementById('timeline-collapse-all').addEventListener('click', () => {
    timelineTab.querySelectorAll('.timeline-day-events').forEach(events => { events.hidden = true; });
    timelineTab.querySelectorAll('.timeline-day-toggle').forEach(button => {
      button.setAttribute('aria-expanded', 'false');
      button.textContent = '⌄';
      button.setAttribute('aria-label', button.getAttribute('aria-label').replace('Recolher', 'Expandir'));
    });
  });
  document.getElementById('timeline-jump-button').addEventListener('click', () => {
    const selectedDate = document.getElementById('timeline-jump-date').value;
    if (!selectedDate) return;
    const [year, month, day] = selectedDate.split('-');
    const dateLabel = `${day}/${month}/${year}`;
    const target = [...timelineTab.querySelectorAll('.timeline-day')]
      .find(group => group.dataset.timelineDate === dateLabel);
    if (!target) {
      document.getElementById('timeline-count').textContent = `Nenhum evento em ${dateLabel}`;
      return;
    }
    const events = target.querySelector('.timeline-day-events');
    const toggle = target.querySelector('.timeline-day-toggle');
    events.hidden = false;
    toggle.setAttribute('aria-expanded', 'true');
    toggle.textContent = '⌃';
    target.scrollIntoView({ behavior:'smooth', block:'start' });
  });
  timelineTab.addEventListener('click', event => {
    const toggle = event.target.closest('[data-toggle-timeline-day]');
    if (toggle) {
      const events = timelineTab.querySelector(`[data-timeline-events="${toggle.dataset.toggleTimelineDay}"]`);
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      events.hidden = expanded;
      toggle.setAttribute('aria-expanded', String(!expanded));
      toggle.textContent = expanded ? '⌄' : '⌃';
      const dayLabel = toggle.closest('.timeline-day').querySelector('.timeline-day-title').textContent;
      toggle.setAttribute('aria-label', `${expanded ? 'Expandir' : 'Recolher'} eventos de ${dayLabel}`);
      return;
    }
    const button = event.target.closest('[data-history-index]');
    if (!button) return;
    const eventIndex = Number(button.dataset.historyIndex);
    const historyEvent = sortedTimeline[eventIndex];
      if (historyEvent.arquivo) {
        openHistoryDetails({
          title:historyEvent.titulo,
          type:historyEvent.tipo + ' · ' + (historyEvent.arquivo.tipo || 'Arquivo'),
          date:historyEvent.data,
          description:historyEvent.desc,
          file:historyEvent.arquivo,
          fileRecord:true
        }, button);
        return;
      }
      openHistoryDetails({
        title:historyEvent.titulo,
        type:historyEvent.tipo,
        date:historyEvent.data,
        description:historyEvent.desc
      }, button);
  });

  // Draw initial sparklines and score history charts.
  setTimeout(() => {
    bioFields.forEach(f => {
      const c = document.getElementById(`spark-${f.key}`);
      if (c) drawSparkline(c, bio.map(b => b[f.key] || 0), f.inv ? '#5B2333' : '#66724A');
    });
    renderScoreVisualizations();
  }, 100);
  window.addEventListener('resize', () => requestAnimationFrame(renderScoreVisualizations));

  // ── Tabs switching logic ──
  const tabsNav = document.getElementById('tabs-nav');
  let tabsDrag = null;
  let suppressTabClick = false;
  tabsNav.addEventListener('pointerdown', event => {
    if (event.pointerType !== 'mouse' || event.button !== 0) return;
    tabsDrag = { pointerId:event.pointerId, startX:event.clientX, startScrollLeft:tabsNav.scrollLeft, moved:false };
    document.addEventListener('pointermove', moveTabsWithPointer);
    document.addEventListener('pointerup', stopTabsPointerDrag);
    document.addEventListener('pointercancel', stopTabsPointerDrag);
  });
  function moveTabsWithPointer(event) {
    if (!tabsDrag || event.pointerId !== tabsDrag.pointerId) return;
    const distance = event.clientX - tabsDrag.startX;
    if (!tabsDrag.moved && Math.abs(distance) > 4) {
      tabsDrag.moved = true;
      tabsNav.classList.add('is-dragging');
    }
    if (tabsDrag.moved) {
      tabsNav.scrollLeft = tabsDrag.startScrollLeft - distance;
      event.preventDefault();
    }
  }
  function stopTabsPointerDrag(event) {
    if (!tabsDrag || event.pointerId !== tabsDrag.pointerId) return;
    suppressTabClick = tabsDrag.moved;
    tabsNav.classList.remove('is-dragging');
    tabsDrag = null;
    document.removeEventListener('pointermove', moveTabsWithPointer);
    document.removeEventListener('pointerup', stopTabsPointerDrag);
    document.removeEventListener('pointercancel', stopTabsPointerDrag);
    if (suppressTabClick) {
      setTimeout(() => { suppressTabClick = false; }, 0);
    }
  }
  tabsNav.addEventListener('click', event => {
    if (!suppressTabClick) return;
    event.preventDefault();
    event.stopImmediatePropagation();
  }, true);

  document.querySelectorAll('#tabs-nav .tab-item').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#tabs-nav .tab-item').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      btn.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'nearest' });

      if (btn.dataset.tab === 'bio') {
        setTimeout(() => {
          bioFields.forEach(f => {
            const c = document.getElementById(`spark-${f.key}`);
            if (c) drawSparkline(c, bio.map(b => b[f.key] || 0), f.inv ? '#5B2333' : '#66724A');
          });
        }, 50);
      }
      if (btn.dataset.tab === 'score') {
        setTimeout(renderScoreVisualizations, 50);
      }
    });
  });

  // Modal Bioimpedância
  function openModalBio() {
    if (!isDoctorView) return;
    document.getElementById('bio-in-data').value = new Date().toISOString().split('T')[0];
    document.getElementById('bio-in-tmb').value = latestBio.tmb || '';
    document.getElementById('modal-bio').classList.add('open');
  }
  function closeModalBio() {
    document.getElementById('modal-bio').classList.remove('open');
  }
  function saveNewBio() {
    if (!isDoctorView) return;
    const dataVal = document.getElementById('bio-in-data').value;
    const pesoVal = parseFloat(document.getElementById('bio-in-peso').value);
    if (!pesoVal) { alert('Informe ao menos o peso.'); return; }

    const baselineBio = p.bioimpedancia[0];
    const heightSquared = baselineBio && baselineBio.imc ? baselineBio.peso / baselineBio.imc : 2.6;
    const entry = {
      data: formatDate(dataVal),
      peso: pesoVal,
      musculo: parseFloat(document.getElementById('bio-in-musculo').value) || latestBio.musculo,
      gordura: parseFloat(document.getElementById('bio-in-gordura').value) || latestBio.gordura,
      imc: parseFloat((pesoVal / heightSquared).toFixed(1)),
      txGordura: parseFloat(document.getElementById('bio-in-tx').value) || latestBio.txGordura,
      aguaCorporal: parseFloat(document.getElementById('bio-in-agua').value) || latestBio.aguaCorporal,
      gorduraVisceral: parseInt(document.getElementById('bio-in-visceral').value) || latestBio.gorduraVisceral,
      tmb: parseFloat(document.getElementById('bio-in-tmb').value) || latestBio.tmb,
      nota: parseFloat(document.getElementById('bio-in-nota').value) || 8.0
    };

    p.bioimpedancia.push(entry);
    p.pesoAtual = pesoVal;
    try {
      localStorage.setItem('lapidar-bio-' + p.id, JSON.stringify(p.bioimpedancia));
      localStorage.setItem('lapidar-pacientes', JSON.stringify(PACIENTES));
    } catch(e) {}
    closeModalBio();
    alert('Nova bioimpedância registrada com sucesso!');
    location.reload();
  }
  }
</script>
<script src="../js/parity-enhancements.js"></script>
<script src="../js/round2-visual.js"></script>
</body>
</html>
