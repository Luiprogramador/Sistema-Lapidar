<!DOCTYPE html>

  <style>
    .contents-page { max-width: 1280px; margin: -2px auto 0; }
    .contents-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 220px;
      margin-bottom: 30px;
      padding: clamp(24px, 5vw, 48px);
      border-radius: var(--radius-xl);
      color: var(--bege);
      background:
        radial-gradient(circle at 84% 20%, rgba(198,161,91,.33), transparent 22%),
        radial-gradient(circle at 75% 100%, rgba(255,255,255,.08), transparent 35%),
        linear-gradient(120deg, var(--vinho-dark), var(--vinho) 70%, #814448);
      overflow: hidden;
    }
    .contents-hero-copy { max-width: 640px; }
    .contents-eyebrow { color: var(--dourado-light); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .contents-hero h1 { margin: 8px 0 10px; color: #fffaf2; font-family: var(--font-serif); font-size: clamp(28px, 4vw, 40px); line-height: 1.12; }
    .contents-hero p { max-width: 570px; color: rgba(255,250,242,.8); font-size: 14px; line-height: 1.7; }
    .contents-hero-mark { flex: 0 0 auto; color: rgba(244,239,231,.18); font-family: var(--font-serif); font-size: clamp(72px, 12vw, 140px); line-height: 1; }
    .contents-toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:24px; }
    .contents-toolbar p { color:var(--text-muted); font-size:13px; }
    .content-section { margin: 0 0 34px; padding:18px 18px 10px; border:1px solid var(--border); border-left:5px solid #87444b; border-radius:16px; background:linear-gradient(135deg,#fffafa,#fff 65%); }
    .content-section:nth-child(5n + 2) { border-left-color:#527b91; background:linear-gradient(135deg,#f5fafc,#fff 65%); }
    .content-section:nth-child(5n + 3) { border-left-color:#718365; background:linear-gradient(135deg,#f7faf4,#fff 65%); }
    .content-section:nth-child(5n + 4) { border-left-color:#b68b42; background:linear-gradient(135deg,#fffbf1,#fff 65%); }
    .content-section:nth-child(5n + 5) { border-left-color:#887093; background:linear-gradient(135deg,#faf7fc,#fff 65%); }
    .content-section-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:14px; }
    .content-section:nth-child(5n + 2) .content-section-heading h2 { color:#416b81; }
    .content-section:nth-child(5n + 3) .content-section-heading h2 { color:#5d7350; }
    .content-section:nth-child(5n + 4) .content-section-heading h2 { color:#956d28; }
    .content-section:nth-child(5n + 5) .content-section-heading h2 { color:#765b82; }
    .content-section-heading h2 { color:var(--vinho); font-family:var(--font-serif); font-size:22px; }
    .content-section-heading p { margin-top:4px; color:var(--text-muted); font-size:12px; }
    .content-see-all { padding:6px 0; color:var(--vinho); font-size:12px; font-weight:600; white-space:nowrap; }
    .content-see-all:hover { text-decoration:underline; }
    .content-rail-wrap { position:relative; }
    .content-rail {
      display:grid;
      grid-auto-columns:minmax(220px, 1fr);
      grid-auto-flow:column;
      gap:14px;
      overflow-x:auto;
      overscroll-behavior-inline:contain;
      scroll-snap-type:x mandatory;
      scrollbar-width:thin;
      scrollbar-color:var(--bege-darker) transparent;
      padding:2px 2px 12px;
    }
    .content-card {
      display:flex;
      flex-direction:column;
      min-width:0;
      width:100%;
      overflow:hidden;
      border:1px solid var(--border);
      border-radius:var(--radius-md);
      background:var(--white);
      box-shadow:var(--shadow-sm);
      scroll-snap-align:start;
      cursor:pointer;
      text-align:left;
      transition:var(--transition);
    }
    .content-card:hover, .content-card:focus-visible { transform:translateY(-3px); border-color:var(--dourado); box-shadow:var(--shadow-md); outline:none; }
    .content-art {
      position:relative;
      display:flex;
      flex:0 0 138px;
      align-items:flex-end;
      box-sizing:border-box;
      width:100%;
      min-height:0;
      padding:15px;
      overflow:hidden;
      color:white;
      background:linear-gradient(135deg, #6c3037, #c39a67);
    }
    .content-art::before, .content-art::after { position:absolute; content:""; border:1px solid rgba(255,255,255,.24); border-radius:50%; }
    .content-art::before { width:150px; height:150px; top:-66px; right:-18px; }
    .content-art::after { width:96px; height:96px; top:-39px; right:9px; }
    .content-art[data-tone="olive"] { background:linear-gradient(135deg,#3e5747,#9b9f6c); }
    .content-art[data-tone="blue"] { background:linear-gradient(135deg,#334e61,#84a9a2); }
    .content-art[data-tone="rose"] { background:linear-gradient(135deg,#794753,#d29a88); }
    .content-art[data-tone="gold"] { background:linear-gradient(135deg,#755a32,#c8a965); }
    .content-art[data-tone="plum"] { background:linear-gradient(135deg,#483851,#9c7899); }
    .content-art-label { position:relative; z-index:1; display:-webkit-box; max-width:95%; overflow:hidden; -webkit-box-orient:vertical; -webkit-line-clamp:3; font-family:var(--font-serif); font-size:19px; line-height:1.15; text-shadow:0 1px 8px rgba(0,0,0,.18); }
    .content-art-type { position:absolute; z-index:1; top:12px; left:12px; padding:4px 8px; border:1px solid rgba(255,255,255,.25); border-radius:var(--radius-full); background:rgba(32,22,22,.2); font-size:10px; font-weight:600; }
    .content-card-body { display:flex; flex:1; flex-direction:column; box-sizing:border-box; width:100%; padding:13px 14px 15px; }
    .content-card-title { display:block; color:var(--text-primary); font-size:13px; font-weight:600; line-height:1.45; }
    .content-card-meta { display:flex; justify-content:space-between; gap:8px; width:100%; margin-top:auto; padding-top:9px; color:var(--text-muted); font-size:11px; }
    .rail-arrow {
      position:absolute; z-index:2; top:62px; display:grid; width:34px; height:34px;
      place-items:center; border:1px solid var(--border); border-radius:50%;
      color:var(--vinho); background:var(--white); box-shadow:var(--shadow);
    }
    .rail-arrow:hover { background:var(--vinho-xlight); }
    .rail-arrow-left { left:-12px; }
    .rail-arrow-right { right:-12px; }
    .contents-gallery { display:none; }
    .contents-gallery.active { display:block; }
    .contents-gallery-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; }
    .contents-empty { padding:40px 20px; border:1px dashed var(--border-dark); border-radius:var(--radius-md); color:var(--text-muted); text-align:center; }
    .contents-modal { position:fixed; inset:0; z-index:300; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(25,15,15,.58); }
    .contents-modal.open { display:flex; }
    .contents-modal-panel { width:min(600px,100%); max-height:90vh; overflow:auto; border-radius:var(--radius-lg); background:var(--white); box-shadow:var(--shadow-lg); }
    .contents-modal-header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 22px; border-bottom:1px solid var(--border); }
    .contents-modal-header h2 { color:var(--vinho); font-family:var(--font-serif); font-size:20px; }
    .contents-modal-body { display:flex; flex-direction:column; gap:14px; padding:22px; }
    .contents-modal-body p { color:var(--text-secondary); font-size:13px; line-height:1.7; }
    .contents-modal-art { min-height:170px; border-radius:var(--radius); }
    .content-art.contents-modal-art.content-art--ebooks { background:#94702e; }
    .content-art.contents-modal-art.content-art--videos { background:#356f9b; }
    .content-art.contents-modal-art.content-art--sites { background:#39765d; }
    .contents-modal-actions { display:flex; justify-content:flex-end; gap:8px; padding:0 22px 22px; }
    @media (max-width:1000px) { .contents-gallery-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (max-width:700px) {
      .contents-hero { min-height:190px; }
      .contents-hero-mark { display:none; }
      .content-rail { grid-auto-columns:minmax(210px, 72%); }
      .contents-gallery-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .rail-arrow { display:none; }
    }
    @media (max-width:420px) { .contents-gallery-grid { grid-template-columns:1fr; } }

    /* Paridade com ContentPage (Flutter): cabeçalho compacto, controles e prateleiras por tipo. */
    .contents-page { max-width: none; }
    .contents-hero { display:none; }
    .contents-toolbar { align-items:center; justify-content:flex-start; flex-wrap:wrap; margin: 12px 0 18px; }
    #contents-context { display:none; }
    .contents-toolbar .contents-controls { display:flex; align-items:center; flex-wrap:wrap; gap:10px; width:100%; }
    .contents-view-toggle { display:inline-flex; gap:3px; padding:4px; border:1px solid var(--border); border-radius:12px; background:var(--surface, var(--white)); }
    .contents-view-toggle button { border:0; border-radius:8px; background:transparent; color:var(--text-secondary); padding:9px 14px; font:600 13px var(--font-sans, inherit); cursor:pointer; }
    .contents-view-toggle button.active { background:var(--vinho); color:#fffaf2; }
    .contents-tags { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:0 0 20px; }
    .contents-tags.collapsed { display:none; }
    .contents-tags.expanded { display:flex; }
    .contents-modal-body .form-group { display:block; margin-bottom:14px; }
    .contents-modal-body .form-label { display:block; margin-bottom:6px; }
    .contents-modal-body .form-input, .contents-modal-body .form-select, .contents-modal-body .form-textarea { width:100%; box-sizing:border-box; }
    .content-card-tags { max-height:42px; overflow:auto; }
    .contents-tags .tag-chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:9px; background:var(--white); color:var(--text-primary); padding:7px 10px; font-size:12px; cursor:pointer; }

    .content-art::before,.content-art::after { display:none; }

<body>
<div id="topbar-container"></div>
<div id="sidebar-container"></div>

<main class="main-content page-enter contents-main">
  <div class="contents-page">
  <header class="contents-page-header">
    <h1>Conteúdos</h1>
    <p id="contents-context">Biblioteca de ebooks, vídeos e sites para pacientes e equipe.</p>
  </header>

        <div class="contents-view-toggle" role="group" aria-label="Visualização dos conteúdos">
          <button type="button" id="contents-carousel-btn" class="active" aria-pressed="true">▤ Carrossel</button>
          <button type="button" id="contents-all-btn" aria-pressed="false">▦ Tudo</button>
        </div>
        <button class="btn btn-subtle btn-sm" id="contents-filter-btn" type="button">⌕ Tags <span aria-hidden="true">▾</span></button>
        <button class="btn btn-primary btn-sm" id="add-content-btn" type="button" hidden>＋ Adicionar material</button>
      </div>
    </div>
    <div class="contents-tags" id="contents-tags" aria-label="Tags selecionadas"></div>

    <div id="contents-home"></div>
    <section class="contents-gallery" id="contents-gallery" aria-live="polite"></section>
  </div>
</main>

<div class="contents-modal" id="contents-modal" role="dialog" aria-modal="true" aria-labelledby="contents-modal-title">
  <div class="contents-modal-panel">
    <div class="contents-modal-header">
      <h2 id="contents-modal-title"></h2>
      <button class="btn btn-subtle btn-sm" id="close-content-modal" type="button" aria-label="Fechar">Fechar</button>
    </div>
    <div class="contents-modal-body" id="contents-modal-body"></div>
    <div class="contents-modal-actions" id="contents-modal-actions"></div>
  </div>
</div>

<script src="../js/demo-data.js"></script>
<script src="../js/data.js"></script>
<script src="../js/router.js"></script>
<script src="../js/components.js"></script>
<script>
  initShell('contents');

  const CONTENTS_STORAGE_KEY = 'lapidar-conteudos';
  const canManageContents = Router.can('manageContent');
  // Conteúdo inicial alinhado ao catálogo seedContents() da interface Flutter.
  const seededSections = [{ name:'Biblioteca', description:'', items:[
    {id:'ct1',title:'Diabetes tipo 2: guia de alimentação',type:'Ebook',summary:'Como montar o prato, contar carboidratos e manter a glicemia estável.',minutes:25,tags:['Diabetes','Nutrição']},
    {id:'ct2',title:'Entendendo a bioimpedância',type:'Ebook',summary:'Massa magra, gordura visceral, água corporal e nota corporal.',minutes:15,tags:['Bioimpedância']},
    {id:'ct3',title:'Cuidando da memória: Alzheimer e prevenção',type:'Ebook',summary:'Hábitos de sono, treino e alimentação que protegem o cérebro.',minutes:30,tags:['Alzheimer','Prevenção'],plus:true},
    {id:'ct4',title:'Parkinson: exercícios e qualidade de vida',type:'Ebook',summary:'Rotina de movimento e orientações para o dia a dia.',minutes:22,tags:['Parkinson','Movimento']},
    {id:'ct5',title:'Como fazer seu check-in no Diário Lapidar',type:'Vídeo',summary:'Movimento, nutrição, sono e bem-estar em cerca de 1 minuto. Constância vale mais que perfeição.',minutes:4,tags:['Diário Lapidar']},
    {id:'ct6',title:'Glicemia na prática: lendo seu exame',type:'Vídeo',summary:'HbA1c, jejum e insulina explicados com exemplos.',minutes:12,tags:['Diabetes','Exames']},
    {id:'ct7',title:'Treino de força para quem tem Parkinson',type:'Vídeo',summary:'Sessão guiada de 20 minutos com adaptações.',minutes:20,tags:['Parkinson','Movimento']},
    {id:'ct8',title:'Sono e memória: o que a ciência mostra',type:'Vídeo',summary:'Por que dormir bem reduz o risco de demência.',minutes:9,tags:['Alzheimer','Sono']},
    {id:'ct9',title:'LDL, ApoB e risco cardiovascular',type:'Vídeo',summary:'Metas de LDL e não-HDL e estratégias para reduzir o risco.',minutes:11,tags:['Dislipidemia','Exames']},
    {id:'ct10',title:'Sociedade Brasileira de Diabetes',type:'Site',summary:'Diretrizes, tabelas de alimentos e materiais para pacientes.',minutes:0,tags:['Diabetes'],url:'https://diabetes.org.br'},
    {id:'ct11',title:'Associação Brasileira de Alzheimer',type:'Site',summary:'Informações, grupos de apoio e orientações a familiares.',minutes:0,tags:['Alzheimer'],url:'https://abraz.org.br'},
    {id:'ct12',title:'Doença de Parkinson: visão geral',type:'Site',summary:'Cuidados, exercícios e informações para pacientes e famílias.',minutes:0,tags:['Parkinson'],url:'https://pt.wikipedia.org/wiki/Doen%C3%A7a_de_Parkinson'},
    {id:'ct13',title:'Guia alimentar para a população brasileira',type:'Site',summary:'Referência oficial do Ministério da Saúde.',minutes:0,tags:['Nutrição','Prevenção'],url:'https://bvsms.saude.gov.br/bvs/publicacoes/guia_alimentar_populacao_brasileira_2ed.pdf'}
  ]}];

  const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;',
  }[char]));

  function contentIcon(type, className = '') {
    const normalized = String(type || '').toLowerCase();
    const shape = normalized.includes('vídeo') || normalized.includes('video')
      ? '<circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/>'
      : normalized.includes('site')
        ? '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>'
        : '<path d="M3 5.5c3.2-.8 6.2-.3 9 1.5v13c-2.8-1.8-5.8-2.3-9-1.5zM21 5.5c-3.2-.8-6.2-.3-9 1.5v13c2.8-1.8 5.8-2.3 9-1.5z"/>';
    return `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shape}</svg>`;
  }

  function loadAddedContents() {
    try {
      const saved = JSON.parse(localStorage.getItem(CONTENTS_STORAGE_KEY) || '[]');
      return Array.isArray(saved) ? saved : [];
    } catch (error) {
      console.error('Não foi possível carregar os conteúdos salvos.', error);
      return [];
    }
  }

  function saveAddedContents(items) {
    try {
      localStorage.setItem(CONTENTS_STORAGE_KEY, JSON.stringify(items));
    } catch (error) {
      console.error('Não foi possível salvar o conteúdo.', error);
      alert('Não foi possível salvar este conteúdo neste navegador.');
      return false;
    }
    return true;
  }

  function getSections() {
    const sections = seededSections.map(section => ({ ...section, items:[...section.items] }));
    sections[0].items.unshift(...loadAddedContents());
    return sections;
  }

  function contentCard(item) {
    const normalizedType = String(item.type || '').toLowerCase();
    const toneClass = normalizedType.includes('vídeo') || normalizedType.includes('video') ? 'videos' : normalizedType.includes('site') ? 'sites' : 'ebooks';
    return `
      <button class="content-card content-card--${toneClass}" type="button" data-content-id="${escapeHTML(item.id)}">
        <span class="content-art" data-tone="${escapeHTML(item.tone || 'gold')}">
          <span class="content-art-type">${contentIcon(item.type)}${escapeHTML(item.type)}</span>
          <span class="content-art-duration">${escapeHTML(item.minutes ? item.minutes + ' min' : 'Conteúdo')}</span>
          ${item.plus ? '<span class="content-art-plus">PLUS</span>' : ''}
          <span class="content-art-label">${escapeHTML(item.title)}</span>
        </span>
        <span class="content-card-body">
          <span class="content-card-meta"><span>${escapeHTML(item.type)}</span><span>${escapeHTML(item.minutes ? item.minutes + ' min' : 'Conteúdo')}</span></span>
          <span class="content-card-title">${escapeHTML(item.title)}</span>
          <span class="content-card-description">${escapeHTML(item.summary || '')}</span>
          <span class="content-card-tags">${(item.tags || []).slice(0,3).map(tag => `<span>${escapeHTML(tag)}</span>`).join('')}</span>
          <span class="content-card-action">${item.type === 'Vídeo' ? 'Assistir →' : item.type === 'Site' ? 'Abrir site →' : 'Ler ebook →'}</span>
        </span>
      </button>`;
  }

  let contentsView = 'carousel';
  let selectedTags = new Set();
  let onlyType = null;
  const typeFor = item => {
    const t = String(item.type || '').toLowerCase();
    if (t === 'vídeo' || t === 'video') return 'Vídeos';
    if (t === 'site') return 'Sites';
    return 'Ebooks';
  };
  const typeAction = type => type === 'Vídeos' ? 'Assistir' : type === 'Sites' ? 'Abrir site' : 'Ler ebook';
  function allContentItems() { return getSections().flatMap(section => section.items.map(item => ({...item, section:item.section || section.name}))); }
  function filteredItems() { return allContentItems().filter(item => (!onlyType || typeFor(item) === onlyType) && (!selectedTags.size || (item.tags || []).some(tag => selectedTags.has(tag)))); }
  function renderTags() {
    const host = document.getElementById('contents-tags');
    const allTags = [...new Set(allContentItems().flatMap(item => item.tags || []))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
    host.innerHTML = allTags.map(tag => `<button type="button" class="tag-chip ${selectedTags.has(tag)?'active':''}" data-tag="${escapeHTML(tag)}" aria-pressed="${selectedTags.has(tag)}">${escapeHTML(tag)}${selectedTags.has(tag)?'<span class="remove">×</span>':''}</button>`).join('') + (selectedTags.size ? '<button type="button" class="tag-chip" id="clear-content-tags">Limpar tags</button>' : '');
    host.querySelectorAll('[data-tag]').forEach(btn => btn.addEventListener('click',()=>{ const tag=btn.dataset.tag; selectedTags.has(tag)?selectedTags.delete(tag):selectedTags.add(tag); renderHome(); }));
    const clear = document.getElementById('clear-content-tags'); if(clear) clear.addEventListener('click',()=>{selectedTags.clear();renderHome();});
  }
  function renderHome() {
    const items = filteredItems();
    renderTags();
    document.getElementById('contents-gallery').classList.toggle('active', contentsView === 'all');
    document.getElementById('contents-home').hidden = contentsView === 'all';
    document.getElementById('contents-carousel-btn').classList.toggle('active', contentsView === 'carousel');
    document.getElementById('contents-all-btn').classList.toggle('active', contentsView === 'all');
    document.getElementById('contents-carousel-btn').setAttribute('aria-pressed', String(contentsView === 'carousel'));
    document.getElementById('contents-all-btn').setAttribute('aria-pressed', String(contentsView === 'all'));
    if(contentsView === 'carousel') {
      const types = ['Ebooks','Vídeos','Sites'];
      document.getElementById('contents-home').innerHTML = types.map(type => {
        const group = items.filter(item => typeFor(item) === type);
        if(!group.length) return '';
        const sectionTone = type === 'Vídeos' ? 'videos' : type === 'Sites' ? 'sites' : 'ebooks';
        return `<section class="content-section content-section--${sectionTone}"><div class="content-section-heading"><div style="display:flex;align-items:center;gap:12px">${contentIcon(type, 'content-type-icon')}<h2>${type} <span style="font:500 12px sans-serif;color:var(--text-muted)">(${group.length})</span></h2></div><button class="content-see-all" type="button" data-only-type="${type}">Ver tudo →</button></div><div class="content-rail-wrap"><div class="content-rail">${group.map(item => contentCard({...item,type:type==='Vídeos'?'Vídeo':type==='Sites'?'Site':'Ebook',duration:item.duration || (item.minutes ? item.minutes+' min' : 'Material')})).join('')}</div></div></section>`;
      }).join('') || '<div class="contents-empty">Nenhum conteúdo encontrado. Ajuste as tags para ver mais materiais.</div>';
      document.querySelectorAll('[data-only-type]').forEach(button => button.addEventListener('click',()=>{onlyType=button.dataset.onlyType;contentsView='all';renderHome();}));
    } else {
      const shown = onlyType ? items.filter(item=>typeFor(item)===onlyType) : items;
      document.getElementById('contents-gallery').innerHTML = `<div class="content-section-heading"><div><h2>${onlyType || 'Todos os conteúdos'}</h2><p>${shown.length} materiais</p></div><button class="content-see-all" type="button" id="gallery-back">← Voltar ao carrossel</button></div><div class="contents-gallery-grid">${shown.map(item=>contentCard({...item,type:typeFor(item)==='Vídeos'?'Vídeo':typeFor(item)==='Sites'?'Site':'Ebook',duration:item.duration || (item.minutes ? item.minutes+' min':'Material')})).join('')}</div>`;
      document.getElementById('gallery-back').addEventListener('click',()=>{contentsView='carousel';onlyType=null;renderHome();});
      if(!shown.length) document.getElementById('contents-gallery').innerHTML += '<div class="contents-empty">Nenhum conteúdo encontrado. Ajuste as tags para ver mais materiais.</div>';
    }
    bindContentCards();
  }

  function findContent(id) {
    return getSections().flatMap(section => section.items).find(item => String(item.id) === id);
  }

  function openContent(item) {
    if (!item) return;
    const modal = document.getElementById('contents-modal');
    const category = typeFor(item);
    const categoryClass = `content-art--${category === 'Vídeos' ? 'videos' : category.toLowerCase()}`;
    document.getElementById('contents-modal-title').textContent = item.title;
    document.getElementById('contents-modal-body').innerHTML = `
      <div class="content-art contents-modal-art ${categoryClass}" data-tone="${escapeHTML(item.tone || 'gold')}">
        <span class="content-art-type">${escapeHTML(item.type)}</span>
        <span class="content-art-label">${escapeHTML(item.title)}</span>
      </div>
      <p>${escapeHTML(item.description || item.summary || '')}</p>
      <span class="badge badge-dourado">${escapeHTML(item.minutes ? item.minutes + ' min' : 'Material da biblioteca')}</span>`;
    if (item.url) {
      const urlLink = document.createElement('a'); urlLink.href = item.url; urlLink.target = '_blank'; urlLink.rel = 'noopener noreferrer'; urlLink.textContent = item.type === 'Site' ? 'Abrir site' : (item.type === 'Vídeo' ? 'Assistir' : 'Abrir material'); urlLink.className = 'btn btn-primary btn-sm'; urlLink.style.marginTop = '14px'; document.getElementById('contents-modal-body').appendChild(urlLink);
    }
    if (item.file && item.file.data) {
      const fileLink = document.createElement('a');
      fileLink.href = item.file.data;
      fileLink.download = item.file.name;
      fileLink.textContent = 'Abrir material PDF';
      fileLink.className = 'btn btn-subtle btn-sm';
      fileLink.style.marginTop = '14px';
      document.getElementById('contents-modal-body').appendChild(fileLink);
    }
    document.getElementById('contents-modal-actions').innerHTML = canManageContents && item.custom
      ? `<button class="btn btn-subtle btn-sm" type="button" id="edit-content-btn">Editar conteúdo</button><button class="btn btn-danger btn-sm" type="button" id="delete-content-btn">Excluir conteúdo</button>`
      : `<button class="btn btn-primary btn-sm" type="button" id="finish-content-btn">Fechar</button>`;
    modal.classList.add('open');
    modal.dataset.contentId = item.id;
    const editButton = document.getElementById('edit-content-btn');
    if (editButton) editButton.addEventListener('click', () => openEditContent(item));
    const deleteButton = document.getElementById('delete-content-btn');
    if (deleteButton) {
      deleteButton.addEventListener('click', () => {
        const remaining = loadAddedContents().filter(content => String(content.id) !== String(item.id));
        if (saveAddedContents(remaining)) {
          closeContentModal();
          renderHome();
        }
      });
    }
    const finishButton = document.getElementById('finish-content-btn');
    if (finishButton) finishButton.addEventListener('click', closeContentModal);
  }

  function openEditContent(item) {
    if (!canManageContents || !item || !item.custom) return;
    const modal = document.getElementById('contents-modal');
    document.getElementById('contents-modal-title').textContent = 'Editar conteúdo';
    document.getElementById('contents-modal-body').innerHTML = `
      <label class="form-group"><span class="form-label">Título</span><input class="form-input" id="edit-content-title" maxlength="80" value="${escapeHTML(item.title || '')}" required></label>
      <label class="form-group"><span class="form-label">Tipo de conteúdo</span><select class="form-select" id="edit-content-type"><option ${item.type==='Ebook'?'selected':''}>Ebook</option><option ${item.type==='Vídeo'?'selected':''}>Vídeo</option><option ${item.type==='Site'?'selected':''}>Site</option></select></label>
      <label class="form-group"><span class="form-label">Descrição</span><textarea class="form-textarea" id="edit-content-summary" rows="4" maxlength="500" required>${escapeHTML(item.summary || item.description || '')}</textarea></label>
      <label class="form-group"><span class="form-label">Tópicos / tags (separe por vírgulas)</span><input class="form-input" id="edit-content-tags" value="${escapeHTML((item.tags || []).join(', '))}"></label>
      <label class="form-group"><span class="form-label">Duração em minutos</span><input class="form-input" id="edit-content-minutes" type="number" min="0" max="999" value="${Number(item.minutes || 0)}"></label>
      <label class="form-group"><span class="form-label">Link do material</span><input class="form-input" id="edit-content-url" type="url" value="${escapeHTML(item.url || '')}" placeholder="https://..."></label>`;
    document.getElementById('contents-modal-actions').innerHTML = '<button class="btn btn-subtle btn-sm" type="button" id="cancel-edit-content">Cancelar</button><button class="btn btn-primary btn-sm" type="button" id="save-edit-content">Salvar alterações</button>';
    document.getElementById('cancel-edit-content').addEventListener('click', () => openContent(item));
    document.getElementById('save-edit-content').addEventListener('click', () => {
      const title = document.getElementById('edit-content-title').value.trim();
      const summary = document.getElementById('edit-content-summary').value.trim();
      if (!title || !summary) { alert('Preencha o título e a descrição.'); return; }
      const updated = loadAddedContents().map(saved => String(saved.id) === String(item.id) ? {
        ...saved, title, summary, description:summary,
        type:document.getElementById('edit-content-type').value,
        tags:document.getElementById('edit-content-tags').value.split(',').map(tag=>tag.trim()).filter(Boolean),
        minutes:Number(document.getElementById('edit-content-minutes').value || 0),
        url:document.getElementById('edit-content-url').value.trim()
      } : saved);
      if (saveAddedContents(updated)) { closeContentModal(); renderHome(); }
    });
  }

  function bindContentCards() {
    document.querySelectorAll('.content-card').forEach(card => {
      card.addEventListener('click', () => openContent(findContent(card.dataset.contentId)));
    });
  }

  function closeContentModal() {
    document.getElementById('contents-modal').classList.remove('open');
  }

  document.getElementById('contents-carousel-btn').addEventListener('click',()=>{contentsView='carousel';onlyType=null;renderHome();});
  document.getElementById('contents-all-btn').addEventListener('click',()=>{contentsView='all';onlyType=null;renderHome();});
  const tagsPanel = document.getElementById('contents-tags');
  tagsPanel.classList.add('collapsed');
  document.getElementById('contents-filter-btn').setAttribute('aria-expanded','false');
  document.getElementById('contents-filter-btn').addEventListener('click',()=>{
    const isCollapsed = tagsPanel.classList.toggle('collapsed');
    tagsPanel.classList.toggle('expanded', !isCollapsed);
    document.getElementById('contents-filter-btn').setAttribute('aria-expanded', String(!isCollapsed));
    if (!isCollapsed) tagsPanel.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
  document.getElementById('close-content-modal').addEventListener('click', closeContentModal);
  document.getElementById('contents-modal').addEventListener('click', event => {
    if (event.target.id === 'contents-modal') closeContentModal();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') closeContentModal();
  });

  if (canManageContents) {
    const addButton = document.getElementById('add-content-btn');
    addButton.hidden = false;
    document.getElementById('contents-context').textContent = 'Biblioteca de ebooks, vídeos e sites para pacientes e equipe.';
    addButton.addEventListener('click', () => {
      document.getElementById('contents-modal-title').textContent = 'Adicionar conteúdo';
      document.getElementById('contents-modal-body').innerHTML = `
        <label class="form-group"><span class="form-label">Título</span><input class="form-input" id="new-content-title" maxlength="80" required placeholder="Ex.: Guia de sono"></label>
        <label class="form-group"><span class="form-label">Tipo de conteúdo</span><select class="form-select" id="new-content-type"><option>Ebook</option><option>Vídeo</option><option>Site</option></select></label>
        <label class="form-group"><span class="form-label">Descrição</span><textarea class="form-textarea" id="new-content-summary" rows="4" maxlength="500" required placeholder="Descrição do material"></textarea></label>
        <label class="form-group"><span class="form-label">Tópicos / tags (separe por vírgulas)</span><input class="form-input" id="new-content-tags" placeholder="Ex.: Diabetes, Nutrição"></label>
        <label class="form-group"><span class="form-label">Duração em minutos (opcional)</span><input class="form-input" id="new-content-minutes" type="number" min="0" max="999" placeholder="Ex.: 15"></label>
        <label class="form-group"><span class="form-label">Link do material (opcional)</span><input class="form-input" id="new-content-url" type="url" placeholder="https://..."></label>
        <label class="form-group"><span class="form-label">Arquivo PDF (opcional, até 1 MB)</span><input class="form-input" id="new-content-pdf" type="file" accept="application/pdf,.pdf"></label>`;
      document.getElementById('contents-modal-actions').innerHTML = '<button class="btn btn-primary btn-sm" type="button" id="save-content-btn">Publicar conteúdo</button>';
      document.getElementById('contents-modal').classList.add('open');
      document.getElementById('save-content-btn').addEventListener('click', () => {
        const title = document.getElementById('new-content-title').value.trim();
        const summary = document.getElementById('new-content-summary').value.trim();
        if (!title || !summary) {
          alert('Preencha o título e a descrição para publicar.');
          return;
        }
        const pdfInput = document.getElementById('new-content-pdf');
        const pdf = pdfInput.files && pdfInput.files[0];
        if (pdf && (pdf.type !== 'application/pdf' || pdf.size > 1024 * 1024)) {
          alert('Envie um arquivo PDF de até 1 MB.');
          return;
        }
        const publishContent = fileData => {
        const items = loadAddedContents();
        items.unshift({
          id:`custom-${Date.now()}`,
          title,
          type:document.getElementById('new-content-type').value,
          summary, description:summary,
          minutes:Number(document.getElementById('new-content-minutes').value || 0),
          tags:document.getElementById('new-content-tags').value.split(',').map(tag=>tag.trim()).filter(Boolean),
          url:document.getElementById('new-content-url').value.trim(),
          tone:['gold','rose','olive','blue','plum'][items.length % 5],
          custom:true,
          file:fileData ? { name:pdf.name, data:fileData } : null,
        });
        if (saveAddedContents(items)) {
          closeContentModal();
          renderHome();
        }
        };
        if (!pdf) {
          publishContent(null);
          return;
        }
        const reader = new FileReader();
        reader.onload = () => publishContent(reader.result);
        reader.onerror = () => alert('Não foi possível ler o arquivo PDF selecionado.');
        reader.readAsDataURL(pdf);
      });
    });
  }

  renderHome();
</script>
<script src="../js/parity-enhancements.js"></script>
<script src="../js/round2-visual.js"></script>
</body>
</html>
