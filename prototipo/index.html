<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lapidar — Sistema</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 16px;
      background: var(--bege);
    }
    .splash {
      text-align: center;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(8px); }
      to   { opacity:1; transform:translateY(0); }
    }
  </style>
</head>
<body>
<div class="splash">
  <svg width="64" height="64" viewBox="0 0 80 80" fill="none" style="margin:0 auto 16px;">
    <polygon points="40,8 72,64 8,64" fill="none" stroke="#5B2333" stroke-width="3"/>
    <polygon points="40,20 62,60 18,60" fill="rgba(91,35,51,0.08)" stroke="#C6A15B" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="5" fill="#C6A15B"/>
  </svg>
  <p style="font-family:'Montserrat',sans-serif;font-size:13px;color:#9B8B7A;">Redirecionando...</p>
</div>

<script src="js/data.js"></script>
<script src="js/router.js"></script>
<script>
  // Redireciona para login (sempre) ao abrir o index
  window.location.replace('pages/login.html');
</script>
</body>
</html>
